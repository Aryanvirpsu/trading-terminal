name: Ubuntu runtime ops (health + off-host backup)

# Off-host safety net for the Ubuntu paper runtime. NEVER trades, NEVER deploys, never modifies the ledger:
# it only READS status and PULLS a consistent backup into a GitHub artifact, then verifies it.
# Uses a DEDICATED restricted SSH key (secret AVDI_OPS_SSH_KEY): the host forces every connection through
# deploy/ubuntu/ops-gate.sh with role `ops` (status | health | evidence | backup-now | backup-list | backup-pull).
# No shell, no port forwarding. Disabled until repository variable AVDI_OPS_ENABLED == 'true'.
on:
  # TIMING IS OWNED BY THE HOST (systemd timers: 15-min health snapshot, 16:25 ET close backup that then dispatches this
  # workflow). GitHub-scheduled runs proved unreliable (2 of ~16 probes fired), so the only cron left is ONE nightly
  # backstop pull; it is idempotent (it pulls the latest already-prepared, host-verified backup).
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avdi-ubuntu-ops
  cancel-in-progress: false

jobs:
  probe:
    if: vars.AVDI_OPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted SSH (ops role)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AVDI_OPS_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.AVDI_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes ${{ secrets.AVDI_SSH_USER }}@${{ secrets.AVDI_SSH_HOST }}" >> "$GITHUB_ENV"
      - name: Status (read-only)
        run: $SSH status | tee status.json
      - name: Health (fails the job when the runtime is unhealthy)
        run: $SSH health
      - name: Evidence boundary and v1.1 P&L (read-only)
        run: $SSH evidence

  backup:
    needs: probe
    if: vars.AVDI_OPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted SSH (ops role)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AVDI_OPS_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.AVDI_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes ${{ secrets.AVDI_SSH_USER }}@${{ secrets.AVDI_SSH_HOST }}" >> "$GITHUB_ENV"
      - name: Host-side verification of the latest prepared backup (sha256 + integrity + contents)
        run: $SSH verify-backup | tee host-verify.json
      - name: Pull the latest backup
        run: $SSH backup-pull > backup.tgz && ls -l backup.tgz
      - name: Verify integrity and contents off-host
        run: |
          mkdir verify && tar -xzf backup.tgz -C verify
          d=$(ls verify | head -1)
          python3 - "verify/$d" <<'PY'
          import hashlib, json, os, sqlite3, sys
          d = sys.argv[1]
          m = json.load(open(os.path.join(d, "MANIFEST.json")))
          assert m["ok"], "host-side manifest not ok"
          names = sorted(m["files"])
          assert any(n.startswith("shadow__") for n in names), "shadow DB missing from backup"
          assert any(not n.startswith("shadow__") for n in names), "ledger missing from backup"
          for n, meta in m["files"].items():
              p = os.path.join(d, n)
              assert hashlib.sha256(open(p, "rb").read()).hexdigest() == meta["sha256"], f"sha mismatch {n}"
              assert sqlite3.connect(p).execute("PRAGMA integrity_check").fetchone()[0] == "ok", f"integrity {n}"
              print("verified", n, os.path.getsize(p), "bytes")
          print("backup", os.path.basename(d), "verified off-host")
          PY
          echo "BACKUP_NAME=$d" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: avdi-ubuntu-backup-${{ github.run_number }}
          path: backup.tgz
          retention-days: 90
          if-no-files-found: error
      - name: Acknowledge the verified off-host copy to the host (health reports it)
        run: $SSH "offhost-ack $BACKUP_NAME"
