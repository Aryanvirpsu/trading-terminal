# C1-PREP item 3 (hardened per the C1-PREP acceptance contract) — builds, tests, and
# publishes ghcr.io/<owner>/<repo>/avdi-dashboard and .../avdi-scheduler. Does NOT
# touch publish-image.yml, which keeps building the separate, pre-existing upstream
# MCP image.
#
# The whole point of this file: a failing test/preflight/smoke check means NO image
# is published as deployable, on every trigger path — not just when something else
# happens to call this workflow first. So the gate lives HERE, not only in
# deploy-c1.yml:
#
#   checkout -> static checks -> tests -> docker build (load, no push yet)
#     -> container preflight -> smoke health/status -> login GHCR -> push
#
# The image that gets pushed is the EXACT image that was just preflighted and
# smoke-tested — built once with `load: true`, then `docker push`'d per tag, never
# rebuilt. That is what makes "local image SHA == published image SHA" a real
# guarantee instead of "both happened to come from the same commit."
#
# Triggers: push to main/c1/cloud-runtime (path-filtered) or a v* tag -> full gate,
# push on success (skipped entirely on a PR — build+gate only, no login, no push).
# workflow_dispatch and workflow_call also available (deploy-c1.yml no longer calls
# this directly — see that file's own header for why — but it stays reusable).

name: Publish AVDI images

on:
  push:
    branches: [main, c1/cloud-runtime]
    tags: ["v*"]
    paths: &image-affecting-paths
      - "docker/Dockerfile.terminal"
      - "docker/Dockerfile.terminal.dockerignore"
      - "docker/requirements-c0-*.txt"
      - "docker/requirements-c0-*.txt.sha256"
      - "docker/entrypoint.sh"
      - "docker/c0_preflight.py"
      - "docker/serve_dashboard.py"
      - "docker/tools/ci_test_gate.py"
      - "docker/compose.c0.yml"
      - "docker/compose.c1.yml"
      - "pyproject.toml"
      - "src/**"
      - "lab/**"
      - "dashboard/**"
      - "canonical/**"
      - "automation/**"
      - "tests/**"
      - ".github/workflows/publish-avdi-images.yml"
  pull_request:
    branches: [main, c1/cloud-runtime]
    paths: *image-affecting-paths
  workflow_dispatch:
  workflow_call:
    outputs:
      dashboard_digest: {description: "Pushed digest of avdi-dashboard (empty on a PR/build-only run)", value: "${{ jobs.dashboard.outputs.digest }}"}
      scheduler_digest: {description: "Pushed digest of avdi-scheduler (empty on a PR/build-only run)", value: "${{ jobs.scheduler.outputs.digest }}"}
      sha_tag: {description: "The sha-<shortsha> tag suffix used for this build", value: "${{ jobs.dashboard.outputs.sha_tag }}"}

concurrency:
  group: publish-avdi-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── gate: repo-wide checks that don't depend on which of the two images you're
  #    looking at. Both image jobs require this to succeed first. ─────────────────
  gate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4

      - name: C0/C1 static checks (compose files parse, build context stays clean)
        run: |
          set -e
          docker compose -f docker/compose.c0.yml config --quiet
          docker compose -f docker/compose.c1.yml config --quiet
          python docker/tools/audit_build_context.py

      - uses: docker/setup-buildx-action@v3

      - name: Build the tests image (no push — local to this job only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.terminal
          target: tests
          platforms: linux/amd64
          push: false
          load: true
          tags: avdi-tests:gate
          cache-from: type=gha,scope=avdi-tests
          cache-to: type=gha,mode=max,scope=avdi-tests

      - name: Tests, judged against the known baseline (both TZ profiles)
        # docker/tools/ci_test_gate.py — see its own header. A bare pytest exit code
        # is the wrong gate on this repo (docs/C0_EQUIVALENCE_REPORT.md §1).
        run: |
          set -e
          for tz in UTC "America/New_York"; do
            echo "::group::ci_test_gate.py  (TZ=$tz)"
            docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ="$tz" \
              --entrypoint python avdi-tests:gate /app/docker/tools/ci_test_gate.py
            echo "::endgroup::"
          done

  # ── dashboard: build -> preflight -> smoke health -> (push only off a PR) ──────
  dashboard:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
      sha_tag: sha-${{ steps.shortsha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: shortsha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/avdi-dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (load only — nothing pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.terminal
          target: dashboard
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=avdi-dashboard
          cache-to: type=gha,mode=max,scope=avdi-dashboard

      - name: Pick one locally-loaded tag to exercise below
        id: reftag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Container preflight (cloud-synthetic profile — the deployment target)
        run: |
          docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ=UTC \
            --entrypoint python '${{ steps.reftag.outputs.tag }}' /app/docker/c0_preflight.py

      - name: Smoke health (start it, poll /api/health, tear down)
        run: |
          set -e
          docker run -d --name smoke-dashboard -e C0_PROFILE=cloud-synthetic -e TZ=UTC \
            -p 127.0.0.1:5057:5057 '${{ steps.reftag.outputs.tag }}'
          ok=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5057/api/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          docker logs smoke-dashboard || true
          docker rm -f smoke-dashboard || true
          if [ -z "$ok" ]; then echo "::error::dashboard /api/health never returned 200"; exit 1; fi

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: {registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}"}

      - name: Push every tag of the EXACT image just preflighted and smoke-tested
        if: github.event_name != 'pull_request'
        id: pushed
        run: |
          set -e
          digest=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            docker push "$t"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$t" | cut -d'@' -f2)
          done <<< '${{ steps.meta.outputs.tags }}'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # ── scheduler: same shape, "smoke health" is a status-command check (no HTTP) ──
  scheduler:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/avdi-scheduler
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (load only — nothing pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.terminal
          target: paper
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=avdi-scheduler
          cache-to: type=gha,mode=max,scope=avdi-scheduler

      - name: Pick one locally-loaded tag to exercise below
        id: reftag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Container preflight (cloud-synthetic profile — the deployment target)
        run: |
          docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ=UTC \
            --entrypoint python '${{ steps.reftag.outputs.tag }}' /app/docker/c0_preflight.py

      - name: Smoke status (no HTTP endpoint on this image — run the real CLI, check it reconciles)
        run: |
          set -e
          out=$(docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ=UTC \
            '${{ steps.reftag.outputs.tag }}' python automation/paper_scheduler.py status)
          echo "$out"
          echo "$out" | grep -q '"reconciled": true' || { echo "::error::scheduler status did not reconcile"; exit 1; }

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: {registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}"}

      - name: Push every tag of the EXACT image just preflighted and smoke-tested
        if: github.event_name != 'pull_request'
        id: pushed
        run: |
          set -e
          digest=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            docker push "$t"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$t" | cut -d'@' -f2)
          done <<< '${{ steps.meta.outputs.tags }}'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
