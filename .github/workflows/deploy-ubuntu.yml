name: Deploy to Ubuntu runtime

# Deploys a specific commit of `main` to the Ubuntu paper runtime host. NOT a trading scheduler.
#  - Manual (workflow_dispatch) only; refuses any ref other than `main`; strategy branches are never deployed.
#  - Disabled until repository variable AVDI_DEPLOY_ENABLED == 'true'.
#  - Uses a DEDICATED restricted SSH key (AVDI_DEPLOY_SSH_KEY): the host forces every connection through
#    deploy/ubuntu/ops-gate.sh with role `deploy` (status | health | deploy <sha>). No shell.
#  - There is deliberately NO `force` input: the host script REFUSES to deploy during the market window
#    (-10 min ... +20 min around the session), so unattended market-hours deployment is impossible.
#  - Host script: build (no downtime) -> graceful stop -> verified backup -> start -> wait healthy ->
#    automatic rollback to the previous image on failure. `simulate_failure` proves the rollback.
on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Start the new release deliberately unhealthy to PROVE automatic rollback (safe test)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avdi-deploy-ubuntu
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AVDI_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test gate (same as CI)
        run: |
          cd docker
          for f in requirements-c0-case1 requirements-c0-dashboard-extra requirements-c0-tests-extra; do
            sha256sum -c "$f.txt.sha256"; python -m pip install --no-deps -r "$f.txt"
          done
          cd .. && python -m pip install --no-deps -e . && python deploy/ci_gate.py tests/unit
      - name: Package this exact commit
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/avdi-src.tgz" HEAD
      - name: Configure restricted SSH (deploy role)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AVDI_DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          printf '%s\n' "${{ secrets.AVDI_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy (tarball streamed to the gate on stdin)
        run: |
          SSH="ssh -i $HOME/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes ${{ secrets.AVDI_SSH_USER }}@${{ secrets.AVDI_SSH_HOST }}"
          SIM=""; [ "${{ github.event.inputs.simulate_failure }}" = "true" ] && SIM="--simulate-failure"
          set +e
          $SSH "deploy ${GITHUB_SHA} $SIM" < "$RUNNER_TEMP/avdi-src.tgz" | tee deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "deploy exit code: $rc"
          if [ -n "$SIM" ]; then
            # the SAFE FAILURE test passes only if the host reported a rollback and a healthy service afterwards
            if grep -q "ROLLING BACK" deploy.log && grep -q "post-rollback health: healthy" deploy.log && [ "$rc" != "0" ]; then
              echo "ROLLBACK PROVEN"
            else
              echo "rollback was NOT proven"; exit 1
            fi
          else
            exit $rc
          fi
      - name: Post-deploy health
        run: |
          SSH="ssh -i $HOME/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes ${{ secrets.AVDI_SSH_USER }}@${{ secrets.AVDI_SSH_HOST }}"
          $SSH health
          $SSH status | head -30
