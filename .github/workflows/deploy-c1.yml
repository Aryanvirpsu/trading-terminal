# C1-PREP item 4 (redesigned per the C1-PREP acceptance contract) — this workflow no
# longer builds anything. publish-avdi-images.yml is the only place images get built,
# tested, preflighted, and pushed — this workflow's job is to take an ALREADY
# PUBLISHED image tag and answer two questions: (1) does it actually exist and pull
# cleanly, and (2) does it still pass the same preflight/health checks once pulled
# from the registry (not just when it was built). Only after both would a deploy be
# attempted — and no deploy step exists yet.
#
#   workflow_dispatch(image_tag)
#           |
#           v
#     validate image SHA        <- docker buildx imagetools inspect, both images
#           |
#           v
#   deployment-ready checks     <- pull + preflight + smoke, from the registry copy
#           |
#           v
#   AZURE DEPLOYMENT — explicit, loud failure, not a skip
#
# The deploy job always RUNS (no `if:` gate hiding it as "skipped") and always
# currently FAILS with an unambiguous reason, because no Azure login step exists yet
# and none may be added until C1.3 (GitHub OIDC -> Azure AD, no static
# AZURE_CLIENT_SECRET, ever — docs/C1_AZURE_BOOTSTRAP_CONTRACT.md). A red, clearly-
# explained workflow run is the intended, correct state today, not a bug to quiet.

name: Deploy AVDI (C1)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag suffix to deploy, e.g. sha-abc1234 (blank = sha-<current HEAD, short>)"
        type: string
        default: ""

concurrency:
  group: deploy-c1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      repo: ${{ steps.tag.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        # github.repository is mixed-case ("Owner/repo"); every ghcr.io reference
        # below must be all-lowercase or Docker rejects it outright ("invalid
        # reference format") — computed once here, passed as a job output, never
        # re-derived from the raw context in a later job.
        run: |
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then tag="sha-$(git rev-parse --short HEAD)"; fi
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Resolving ghcr.io/$repo/avdi-{dashboard,scheduler}:$tag"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Confirm both images exist at this tag (fails clearly if not published)
        run: |
          set -e
          docker buildx imagetools inspect "ghcr.io/${{ steps.tag.outputs.repo }}/avdi-dashboard:${{ steps.tag.outputs.tag }}"
          docker buildx imagetools inspect "ghcr.io/${{ steps.tag.outputs.repo }}/avdi-scheduler:${{ steps.tag.outputs.tag }}"

  deployment-ready-checks:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      REPO: ${{ needs.validate.outputs.repo }}
    steps:
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}"}

      - name: Pull the exact published images (not a local rebuild)
        run: |
          set -e
          docker pull "ghcr.io/$REPO/avdi-dashboard:$TAG"
          docker pull "ghcr.io/$REPO/avdi-scheduler:$TAG"

      - name: Preflight the pulled dashboard image
        run: |
          docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ=UTC --entrypoint python \
            "ghcr.io/$REPO/avdi-dashboard:$TAG" /app/docker/c0_preflight.py

      - name: Preflight the pulled scheduler image
        run: |
          docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ=UTC --entrypoint python \
            "ghcr.io/$REPO/avdi-scheduler:$TAG" /app/docker/c0_preflight.py

      - name: Smoke health — pulled dashboard image
        run: |
          set -e
          docker run -d --name deploy-check-dashboard -e C0_PROFILE=cloud-synthetic -e TZ=UTC \
            -p 127.0.0.1:5057:5057 "ghcr.io/$REPO/avdi-dashboard:$TAG"
          ok=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5057/api/health || true)
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 3
          done
          docker logs deploy-check-dashboard || true
          docker rm -f deploy-check-dashboard || true
          [ -n "$ok" ] || { echo "::error::pulled dashboard image failed its health check"; exit 1; }

      - name: Smoke status — pulled scheduler image
        run: |
          set -e
          out=$(docker run --rm -e C0_PROFILE=cloud-synthetic -e TZ=UTC \
            "ghcr.io/$REPO/avdi-scheduler:$TAG" python automation/paper_scheduler.py status)
          echo "$out"
          echo "$out" | grep -q '"reconciled": true' || { echo "::error::pulled scheduler image did not reconcile"; exit 1; }

  deploy:
    needs: [validate, deployment-ready-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # required for OIDC once C1.3 wires it up — unused until then
    steps:
      - name: Cloud deployment gate
        run: |
          if [ "${{ vars.AZURE_DEPLOY_ENABLED }}" != "true" ]; then
            echo "::error::Cloud deployment not enabled: C1.3 (GitHub OIDC -> Azure AD) has not been completed."
            echo "See docs/C1_AZURE_BOOTSTRAP_CONTRACT.md. No AZURE_CLIENT_SECRET or other static credential"
            echo "will ever be added here — this step waits for a federated-credential OIDC login step,"
            echo "added deliberately in C1.3, not for a variable flip alone."
            exit 1
          fi
          echo "::error::vars.AZURE_DEPLOY_ENABLED is true but no OIDC login/deploy step has been implemented yet."
          echo "This is still C1.3+ work — implement azure/login@v2 with federated credentials, then the"
          echo "actual deploy (pull ghcr.io/${{ needs.validate.outputs.repo }}/avdi-{dashboard,scheduler}:${{ needs.validate.outputs.tag }}"
          echo "on the target host, docker compose -f docker/compose.c1.yml --profile cloud-synthetic up -d,"
          echo "then poll /api/health) here, replacing this whole step."
          exit 1
