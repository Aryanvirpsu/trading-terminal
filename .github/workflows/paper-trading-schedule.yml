name: Paper Trading — Daily Automated Run

# Runs the existing paper-trading pipeline (automation/paper_scheduler.py) on a
# schedule, entirely on GitHub's infrastructure — no dependency on any local
# machine being on. This is IN SCOPE under the active build freeze (see
# CLAUDE.md): it only *runs* the existing, frozen pipeline, it never edits it.
#
# The ledger lives in a GitHub Actions cache (never committed to git — see
# PAPER_BASELINE.md's "no account DBs are ever tracked" rule), keyed so each
# run picks up where the previous one left off. It is a SEPARATE ledger from
# the one on the developer's local machine at ~/.tradingview_mcp_data — the
# two are not synced.
#
# Two cron lines cover both halves of the year; a guard step skips the one
# that doesn't currently land on 9:30am America/New_York, so this keeps firing
# at the right wall-clock time straight through the DST changeover with no
# manual edits.
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 9:30am ET while EDT (UTC-4) is in effect
    - cron: "30 14 * * 1-5"   # 9:30am ET while EST (UTC-5) is in effect
  workflow_dispatch: {}         # manual "run now" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: paper-trading-ledger
  cancel-in-progress: false

jobs:
  run-paper-day:
    runs-on: ubuntu-latest
    steps:
      - name: Only proceed at ~9:30am ET (DST guard)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hm=$(TZ="America/New_York" date +%H%M)
          echo "current America/New_York time: $hm"
          if [ "$hm" -ge 920 ] && [ "$hm" -le 940 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — this cron fire isn't the one for the current DST offset."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Compute today's ledger cache key
        if: steps.gate.outputs.run == 'true'
        id: cachekey
        run: echo "key=paper-ledger-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Restore paper ledger from the most recent run
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tradingview_mcp_data
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            paper-ledger-

      - name: Install project
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e .

      - name: Run today's paper-trading session (premarket + hours + postmarket)
        if: steps.gate.outputs.run == 'true'
        env:
          PAPER_DATA_DIR: ${{ runner.temp }}/tradingview_mcp_data/paper
        run: python automation/paper_scheduler.py all

      - name: Save paper ledger for tomorrow
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tradingview_mcp_data
          key: ${{ steps.cachekey.outputs.key }}

      - name: Back up the raw ledger DB (in case the cache is ever evicted)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ledger-db-${{ github.run_number }}
          path: ${{ runner.temp }}/tradingview_mcp_data/paper/*.db
          retention-days: 90
          if-no-files-found: ignore

      - name: Archive today's report and commit it
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p reports/paper
          cp PAPER_DAILY_REPORT.md "reports/paper/$(date -u +%Y-%m-%d).md"
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          git add PAPER_DAILY_REPORT.md reports/paper/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Paper trading report: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Post today's report to the run summary
        if: steps.gate.outputs.run == 'true' && always()
        run: cat PAPER_DAILY_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
