<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Terminal · $500</title>
<style>
:root{
  --bg:#080b11; --panel:#0f151e; --panel2:#0b1017; --raise:#141c28;
  --border:#1d2836; --border2:#293646; --text:#d9e1ec; --dim:#7d8ba0; --dim2:#54606f;
  --accent:#4c8dff; --accent-dim:#1c3253; --green:#2bd07c; --red:#fb4d5f; --amber:#f0b429;
  --paper:#4c8dff; --cash:#f0b429; --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:48px 1fr;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .accent{color:var(--accent)}
button{font-family:inherit;cursor:pointer}

/* ── TOP COMMAND BAR ── */
#topbar{grid-row:1;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(180deg,#0f151e,#0b1017);border-bottom:1px solid var(--border);z-index:40}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;font-size:13px;white-space:nowrap}
.brand .diamond{color:var(--accent)}
#searchWrap{position:relative;flex:0 1 320px;min-width:150px}
#search{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;color:var(--text);
  padding:7px 10px 7px 30px;font-family:var(--mono);font-size:12px;outline:none}
#search:focus{border-color:var(--accent)}
#searchWrap .mag{position:absolute;left:9px;top:7px;color:var(--dim);font-size:13px}
#searchWrap .kbd{position:absolute;right:8px;top:6px;font-size:10px;color:var(--dim2);border:1px solid var(--border2);border-radius:4px;padding:1px 5px}
#searchResults{position:absolute;top:38px;left:0;right:0;background:var(--raise);border:1px solid var(--border2);border-radius:8px;overflow:hidden;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5);max-height:320px;overflow-y:auto}
#searchResults .r{padding:7px 11px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;border-bottom:1px solid var(--border);align-items:center}
#searchResults .r:hover,#searchResults .r.sel{background:var(--accent-dim)}
#searchResults .r .rl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#searchResults .r .rr{flex-shrink:0;font-size:10px;white-space:nowrap}
#searchResults .rhead{padding:5px 11px;font-size:9px;letter-spacing:.09em;color:var(--dim2);text-transform:uppercase;background:var(--panel2);border-bottom:1px solid var(--border)}
#searchResults .tt{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.04em;padding:1px 4px;border-radius:3px;border:1px solid var(--border2);color:var(--dim);vertical-align:middle}
/* comparison workspace */
.cmp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border2);border-radius:16px;padding:4px 8px 4px 9px;margin:0 6px 6px 0;font-size:12px}
.cmp-chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cmp-chip b{cursor:pointer;color:var(--dim);font-weight:700;padding:0 2px}
.cmp-chip b:hover{color:var(--red)}
.cmp-add{position:relative;display:inline-block;vertical-align:top}
.cmp-add input{background:var(--panel2);border:1px dashed var(--border2);border-radius:16px;color:var(--text);padding:5px 11px;font-size:12px;width:170px;outline:none}
.cmp-add input:focus{border-color:var(--accent);border-style:solid}
.cmp-dd{position:absolute;top:32px;left:0;z-index:30;background:var(--raise);border:1px solid var(--border2);border-radius:8px;min-width:240px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5);max-height:260px;overflow-y:auto}
.cmp-dd .r{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border)}
.cmp-dd .r:hover{background:var(--accent-dim)}
.cmp-legrow{display:flex;flex-wrap:wrap;gap:14px;padding:6px 8px 2px}
.cmp-leg,.cmp-hd{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.cmp-leg i,.cmp-hd i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
table.cmp-tbl,table.cmp-corr{width:100%;border-collapse:collapse;font-size:12px}
table.cmp-tbl th,table.cmp-tbl td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.cmp-tbl th{color:var(--dim);font-weight:600;position:sticky;top:0}
table.cmp-tbl td.cmp-lab,table.cmp-tbl td.l,table.cmp-tbl th:first-child{text-align:left;color:var(--dim)}
table.cmp-tbl tr:hover td{background:var(--accent-dim)}
table.cmp-corr th,table.cmp-corr td{padding:6px 9px;text-align:center;border:1px solid var(--border);font-size:11px}
table.cmp-corr th{color:var(--dim);font-weight:600}
.tb-spacer{flex:1}
.tb-item{display:flex;flex-direction:column;line-height:1.25;padding:0 4px}
.tb-item .lab{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2)}
.tb-item .val{font-family:var(--mono);font-size:12px}
.acct-seg{display:flex;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.acct-seg button{background:transparent;border:0;color:var(--dim);padding:6px 12px;font-size:11px;font-weight:600}
.acct-seg button.on[data-a=paper]{background:var(--accent);color:#04101f}
.acct-seg button.on[data-a=cash]{background:var(--cash);color:#1a1400}
.tb-btn{background:var(--panel2);border:1px solid var(--border2);border-radius:7px;color:var(--dim);padding:6px 10px;font-size:12px}
.tb-btn:hover{color:var(--text);border-color:var(--accent)}

/* ── SHELL ── */
#shell{grid-row:2;display:grid;grid-template-columns:56px 1fr;min-height:0}
#rail{background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:3px}
#rail button{width:44px;height:44px;border-radius:9px;background:transparent;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:8px;letter-spacing:.3px}
#rail button .ic{font-size:16px}
#rail button:hover{background:var(--raise);color:var(--text)}
#rail button.on{background:var(--accent-dim);color:var(--accent)}
#rail button.trade{color:var(--green)}
#rail button.trade.on{background:rgba(43,208,124,.16);color:var(--green)}
#rail .grow{flex:1}
/* perf panel */
#perfPanel{position:fixed;bottom:0;right:0;width:min(420px,94vw);max-height:52vh;overflow:auto;background:var(--panel);border:1px solid var(--border2);border-radius:10px 0 0 0;z-index:70;display:none;font-size:11px;box-shadow:-8px -8px 30px rgba(0,0,0,.5)}
#perfPanel.on{display:block}
#perfPanel .ph{position:sticky;top:0;background:var(--panel2);padding:8px 12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);font-weight:600}
#perfPanel .pb{padding:10px 12px}
#perfPanel table{font-size:10px}
.chip-refresh{font-size:9px;color:var(--amber);opacity:0;transition:opacity .2s}
.chip-refresh.on{opacity:1}

#main{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
/* portfolio strip */
#pstrip{display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
#pstrip.cash{box-shadow:inset 3px 0 0 var(--cash)}
#pstrip.paper{box-shadow:inset 3px 0 0 var(--accent)}
.pcell{padding:8px 16px;border-right:1px solid var(--border);white-space:nowrap;min-width:110px}
.pcell .lab{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim2);display:flex;gap:5px;align-items:center}
.pcell .val{font-family:var(--mono);font-size:16px;margin-top:2px}
.pcell.tag{display:flex;align-items:center}
#viewport{overflow-y:auto;padding:14px;min-height:0}

/* ── PRIMITIVES ── */
.grid{display:grid;gap:12px}
.c12{grid-template-columns:repeat(12,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 14px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}
.span7{grid-column:span 7}.span8{grid-column:span 8}.span9{grid-column:span 9}.span12{grid-column:span 12}
@media(max-width:1200px){.span3,.span4,.span5{grid-column:span 6}.span7,.span8,.span9{grid-column:span 12}}
@media(max-width:820px){[class*=span]{grid-column:span 12}}

table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:right;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
thead th:first-child,tbody td:first-child{text-align:left}
thead th.nosort{cursor:default}
thead th .arrow{color:var(--accent);font-size:9px}
tbody td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);white-space:nowrap}
tbody tr:hover{background:var(--raise)}
tbody tr.click{cursor:pointer}
.tbl-wrap{overflow:auto;max-height:100%}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.3px;border:1px solid transparent;white-space:nowrap}
.b-bull{background:rgba(43,208,124,.14);color:var(--green);border-color:rgba(43,208,124,.3)}
.b-bear{background:rgba(251,77,95,.14);color:var(--red);border-color:rgba(251,77,95,.3)}
.b-neut{background:rgba(125,139,160,.14);color:var(--dim);border-color:rgba(125,139,160,.28)}
.b-fresh{background:rgba(43,208,124,.14);color:var(--green)}
.b-ageing{background:rgba(240,180,41,.10);color:var(--amber)}
.b-stale{background:rgba(240,180,41,.14);color:var(--amber);border-color:rgba(240,180,41,.3)}
.b-critical{background:rgba(251,77,95,.14);color:var(--red);border-color:rgba(251,77,95,.3)}
.b-fallback{background:rgba(240,180,41,.14);color:var(--amber);border-color:rgba(240,180,41,.35)}
.b-throttle{background:rgba(240,180,41,.14);color:var(--amber);border-color:rgba(240,180,41,.3)}
.b-fail{background:rgba(251,77,95,.14);color:var(--red);border-color:rgba(251,77,95,.3)}
.b-info{background:var(--accent-dim);color:var(--accent)}
.b-A{background:rgba(43,208,124,.16);color:var(--green)} .b-B{background:rgba(76,141,255,.16);color:var(--accent)}
.b-C{background:rgba(240,180,41,.16);color:var(--amber)} .b-D{background:rgba(251,77,95,.16);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.a{background:var(--amber)}.dot.d{background:var(--dim2)}

.sectile{border:1px solid var(--border2);border-radius:7px;padding:8px 10px;cursor:pointer;transition:transform .08s,box-shadow .08s;min-height:78px}
.sectile:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.25);border-color:var(--accent)}
.tip{border-bottom:1px dotted var(--dim2);cursor:help}
.pill-btn{background:var(--panel2);border:1px solid var(--border2);color:var(--dim);border-radius:6px;padding:4px 9px;font-size:11px}
.pill-btn:hover{color:var(--text)}
.pill-btn.on{background:var(--accent);color:#04101f;border-color:var(--accent)}
.seg{display:inline-flex;gap:3px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:2px}
.seg button{background:transparent;border:0;color:var(--dim);padding:4px 9px;font-size:11px;border-radius:5px}
.seg button.on{background:var(--accent);color:#04101f;font-weight:600}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--raise) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:5px;height:12px;margin:7px 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* empty/error state */
.state{padding:20px;text-align:center;color:var(--dim)}
.state .ico{font-size:22px;margin-bottom:6px}
.state .msg{font-size:12px;margin-bottom:4px;color:var(--text)}
.state .sub{font-size:11px;color:var(--dim2)}
.state button{margin-top:9px}
.prov{font-size:10px;color:var(--dim2);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* tabs */
#stockTabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
#stockTabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:9px 13px;font-size:12px;font-weight:600;white-space:nowrap}
#stockTabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabpane{display:none} .tabpane.on{display:block}

.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.kv:last-child{border:0}
.kv .k{color:var(--dim)} .kv .v{font-family:var(--mono)}

.metric-lg{font-family:var(--mono);font-size:26px;line-height:1}
.hbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;display:flex}
.hbar i{display:block;height:100%}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,92vw);background:var(--panel);border-left:1px solid var(--border2);transform:translateX(100%);transition:transform .2s ease;z-index:60;display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
.drawer.open{transform:translateX(0)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.drawer .db{overflow-y:auto;padding:14px}
.drawer .x{background:transparent;border:0;color:var(--dim);font-size:18px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
#scrim.on{display:block}

svg .axis{stroke:var(--border);stroke-width:1}
.chart-label{font-size:10px;fill:var(--dim);font-family:var(--mono)}
.hidden{display:none!important}
.flexrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.mkt-open{color:var(--green)} .mkt-closed{color:var(--dim)}
.alert{display:flex;gap:9px;padding:8px 10px;border-radius:7px;background:var(--panel2);border-left:3px solid var(--border2);margin-bottom:7px;font-size:12px}
.alert.warn{border-left-color:var(--amber)} .alert.bad{border-left-color:var(--red)} .alert.ok{border-left-color:var(--green)}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand"><span class="diamond">◆</span> STRATEGY&nbsp;TERMINAL</div>
  <div id="searchWrap">
    <span class="mag">⌕</span>
    <input id="search" placeholder="Search any ticker…  AAPL, SPY, BRK.B" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
    <div id="searchResults"></div>
  </div>
  <div class="acct-seg" id="acctSeg">
    <button data-a="paper" class="on">Paper</button>
    <button data-a="cash">Cash</button>
    <button data-a="robinhood">Robinhood</button>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-item"><span class="lab">Market</span><span class="val" id="mktStatus">—</span></div>
  <div class="tb-item"><span class="lab">Data</span><span class="val" id="freshTag">—</span></div>
  <button class="tb-btn" id="refreshBtn" title="Refresh (r)">⟳</button>
  <button class="tb-btn" id="healthBtn" title="System health (h)">◉ Health</button>
</div>

<div id="shell">
  <nav id="rail">
    <button data-view="trading" class="trade"><span class="ic">⚡</span>Trade</button>
    <button data-view="home" class="on"><span class="ic">▦</span>Home</button>
    <button data-view="scanner"><span class="ic">⊞</span>Scan</button>
    <button data-view="sectors"><span class="ic">▩</span>Sectors</button>
    <button data-view="stock"><span class="ic">◉</span>Stock</button>
    <button data-view="compare"><span class="ic">⚖</span>Compare</button>
    <button data-view="catalysts"><span class="ic">◆</span>Cat</button>
    <button data-view="news"><span class="ic">✎</span>News</button>
    <span class="grow"></span>
    <button data-view="scheduler"><span class="ic">◷</span>Sched</button>
    <button data-view="settings"><span class="ic">⚙</span>Set</button>
  </nav>

  <div id="main">
    <div id="pstrip" class="paper"><div class="pcell"><div class="lab">loading…</div><div class="val">—</div></div></div>
    <div id="viewport">
      <div id="view-trading" class="view hidden"></div>
      <div id="view-home" class="view"></div>
      <div id="view-scanner" class="view hidden"></div>
      <div id="view-sectors" class="view hidden"></div>
      <div id="view-stock" class="view hidden"></div>
      <div id="view-compare" class="view hidden"></div>
      <div id="view-catalysts" class="view hidden"></div>
      <div id="view-news" class="view hidden"></div>
      <div id="view-scheduler" class="view hidden"></div>
      <div id="view-settings" class="view hidden"></div>
    </div>
  </div>
</div>

<div id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><b id="drawerTitle">—</b><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="db" id="drawerBody"></div>
</div>
<div class="drawer" id="healthDrawer">
  <div class="dh"><b>◉ System Health</b><button class="x" onclick="closeHealth()">✕</button></div>
  <div class="db" id="healthBody"></div>
</div>
<div id="perfPanel">
  <div class="ph"><span>⚡ Performance (dev)</span><span><span id="perfLive" class="dim">—</span> <button class="x" style="font-size:14px" onclick="togglePerf()">✕</button></span></div>
  <div class="pb" id="perfBody"></div>
</div>

<script>
// ═══════════════ STATE ═══════════════
const LS='term_state_v1';
const state=Object.assign({ticker:'AAPL',account:'paper',view:'home',tab:'overview',tf:'3M',
  scanFilter:{side:'options',minScore:0}}, JSON.parse(localStorage.getItem(LS)||'{}'));
function save(){localStorage.setItem(LS,JSON.stringify(state))}

// ═══════════════ HELPERS ═══════════════
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const money=n=>n==null?'–':(n<0?'-$':'$')+Math.abs(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>n==null?'–':'$'+(+n).toLocaleString(undefined,{maximumFractionDigits:0});
const pct=n=>n==null?'–':(n>=0?'+':'')+(+n).toFixed(2)+'%';
const num=(n,d=2)=>n==null?'–':(+n).toFixed(d);
const cls=n=>n==null?'dim':(n>0?'green':n<0?'red':'dim');
const clsPct=n=>n==null?'dim':(n>=0?'green':'red');
const esc=s=>(s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=s=>s==null?'—':s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+'m':s<86400?Math.round(s/3600)+'h':Math.round(s/86400)+'d';
// ── Centralized client data layer: cache + in-flight dedup + SWR + cancellation ──
const DL={
  cache:new Map(),      // url -> {ts,data}
  inflight:new Map(),   // url -> {promise,controller}
  gen:new Map(),        // group -> generation token (for cancel-on-switch)
  stats:{requests:0,dedup:0,hit:0,miss:0,stale:0,bytes:0},
  ttl(u){ if(u.startsWith('/api/state')||u.startsWith('/api/trading'))return 2000;
    if(u.startsWith('/api/market'))return 5000; if(u.startsWith('/api/quotes'))return 3000;
    if(u.startsWith('/api/symbol/technicals')||u.startsWith('/api/symbol/options'))return 20000;
    if(u.startsWith('/api/symbol/chart'))return 60000;
    if(u.includes('/catalysts')||u.includes('/sentiment')||u.includes('/news'))return 120000;
    if(u.includes('/fundamentals'))return 3600000; if(u.includes('/resolve'))return 86400000;
    if(u.startsWith('/api/candidates'))return 60000; if(u.startsWith('/api/scheduler')||u.startsWith('/api/health'))return 10000;
    return 15000; },
  _fetch(url){
    const controller=new AbortController();
    const p=fetch(url,{signal:controller.signal}).then(async r=>{
      const t=await r.text(); this.stats.bytes+=t.length;
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=JSON.parse(t); this.cache.set(url,{ts:Date.now(),data:d}); this.inflight.delete(url); return d;
    }).catch(e=>{ this.inflight.delete(url); const c=this.cache.get(url); if(c&&e.name!=='AbortError')return c.data; throw e; });
    this.inflight.set(url,{promise:p,controller}); return p;
  },
  // Returns {data,cache} where cache∈live|stale|miss|dedup. On 'stale' a bg refresh runs.
  async get(url,{force=false,ttl=null}={}){
    this.stats.requests++;
    const c=this.cache.get(url), age=c?Date.now()-c.ts:Infinity, T=ttl??this.ttl(url);
    if(c&&age<T&&!force){this.stats.hit++;return{data:c.data,cache:'live'};}
    if(this.inflight.has(url)){this.stats.dedup++;try{return{data:await this.inflight.get(url).promise,cache:'dedup'};}catch(e){if(c)return{data:c.data,cache:'stale'};return{data:{__err:e.message},cache:'err'};}}
    if(c&&!force){this.stats.stale++;this._fetch(url).catch(()=>{});return{data:c.data,cache:'stale'};} // SWR: serve stale now, refresh bg
    this.stats.miss++;
    try{return{data:await this._fetch(url),cache:'miss'};}catch(e){return{data:{__err:e.message},cache:'err'};}
  },
  // cancel all in-flight requests whose url includes any of the given fragments
  cancel(fragments){ for(const [u,{controller}] of this.inflight){ if(fragments.some(f=>u.includes(f))){try{controller.abort();}catch(_){}}}},
  bump(group){ const g=(this.gen.get(group)||0)+1; this.gen.set(group,g); return g; },
  current(group){ return this.gen.get(group)||0; }
};

function drawCompareChart(el,r,idx){

function drawCorr(el,corr,idx){

function paintScan(){
  const tbl=$('#scanTbl');
  let rows=scanData.filter(r=>r.score>=state.scanFilter.minScore);
  rows.sort((a,b)=>{const m=scanSort.dir;const A=a[scanSort.k],B=b[scanSort.k];return (A>B?1:A<B?-1:0)*m});
  if(!rows.length){tbl.innerHTML='<div class="state"><div class="ico">○</div><div class="msg">No candidates pass the filter</div><div class="sub">Lower the min score, or an empty scan is a valid "cash" day.</div></div>';return}
  const H=[['sym','Symbol'],['score','Score'],['grade','Grade'],['signal','Signal'],['rsi','RSI'],['chg','Chg%'],['entry','Entry'],['rr','R:R'],['opt','Option']];
  tbl.innerHTML=`<table><thead><tr>${H.map(([k,l])=>`<th onclick="sortScan('${k}')">${l} ${scanSort.k===k?`<span class="arrow">${scanSort.dir<0?'▼':'▲'}</span>`:''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr class="click" onmouseenter="prefetch('${r.sym}')" onclick="openStockDrawer('${r.sym}')"><td><b>${r.sym}</b></td><td>${r.score}</td><td>${badgeGrade(r.grade)}</td>

}

async function loadQuoteHeader(){

  // call): name + exchange + type paint immediately so the header is never blank.
  $('#st-quote').innerHTML='<span class="dim" style="font-size:11px">loading quote…</span>';
  api('/api/search?q='+encodeURIComponent(state.ticker)+'&limit=1').then(sr=>{

    if(it && $('#st-sym').textContent===state.ticker){
      $('#st-name').innerHTML=esc(it.name||'')+(it.type?` <span class="tt" style="margin-left:4px">${esc((it.type||'').slice(0,4).toUpperCase())}</span>`:'')

    }
  }).catch(()=>{});
  // PHASE 2 — live price from the provider (fills the quote when ready).

}

async function tabOverview(){
  host(`<div class="grid c12">

function setupGrid(r){return `<div class="grid c12" style="gap:8px">
  ${['price','entry_range','stop','target','risk_reward','max_loss_usd'].map(k=>{const lab={price:'Price',entry_range:'Entry',stop:'Stop',target:'Target',risk_reward:'R:R',max_loss_usd:'Max Loss'}[k];
    let val=r[k];if(k==='entry_range')val=money(val[0])+'–'+money(val[1]);else if(k==='risk_reward')val=num(val,2);else val=money(val);
    return `<div class="span4"><div class="kv"><span class="k">${lab}</span><span class="v">${val}</span></div></div>`}).join('')}
</div>`;}
function famBars(fams){
  const f2=(fams||[]).slice().sort((a,b)=>Math.abs(b.weighted)-Math.abs(a.weighted));
  return f2.map(f=>{const w=f.weighted;const wd=Math.min(50,Math.abs(w)*100);
    return `<div style="margin-bottom:9px" class="tip" title="${esc(f.detail||'')}"><div class="flexrow" style="justify-content:space-between;font-size:11px"><span>${esc(f.family)}</span><span class="mono ${cls(w)}">${w>0?'+':''}${(+w).toFixed(2)}</span></div>
    <div class="hbar" style="margin-top:3px;justify-content:center;background:var(--panel2)"><i style="width:${wd}%;background:${w>=0?'var(--green)':'var(--red)'};margin-${w>=0?'left':'right'}:50%"></i></div></div>`}).join('');
}
function dataQualityRow(r){
  const src=r.data_source||'';
  // Freshness via the ONE shared classifier — same badge as the global header, so
  // header and engine can never disagree.
  const badge = r.freshness ? freshBadge(r.freshness) :
    (r.data_state==='fallback-provider'?freshBadge('fallback'):(r.data_state==='fresh'?freshBadge('fresh'):''));
  const dq = r.data_confidence!=null?`<span class="tip" title="Mean confidence across active families">Data quality <b class="mono">${(r.data_confidence*100).toFixed(0)}%</b></span>`:'';
  const ec = r.execution_confidence!=null?`<span class="tip" title="Liquidity × volatility execution gate">Execution <b class="mono">${(r.execution_confidence*100).toFixed(0)}%</b></span>`:'';
  const oc = r.overall_confidence!=null?`<span class="tip" title="Data confidence after freshness + disagreement penalties">Overall <b class="mono">${(r.overall_confidence*100).toFixed(0)}%</b></span>`:'';
  return `<div class="flexrow" style="gap:10px;margin-top:10px;flex-wrap:wrap;font-size:11px">${badge} ${dq} ${ec} ${oc} <span class="dim">${esc(src)}</span></div>`;
}
function renderOverviewSummary(s){
  const dc={TRADEABLE:'b-bull',MONITOR:'b-neut',REJECT:'b-bear'}[s.decision]||'b-neut';
  const lab={TRADEABLE:'✓ TRADEABLE',MONITOR:'◐ MONITOR',REJECT:'⛔ NO TRADE'}[s.decision]||esc(s.decision);
  $('#ov-status').innerHTML=ovStatusBadge('summary',(s.pending_families||[]).length);
  $('#ov-main').innerHTML=`<div class="flexrow" style="margin-bottom:12px;flex-wrap:wrap;gap:8px;align-items:center">
      <span class="badge ${dc}" style="font-size:12px">${lab}</span>
      <span class="badge b-info" title="Provisional — from the two fast families (trend + regime) only; the deep pass runs all gates and can upgrade to TRADEABLE">PROVISIONAL</span>
      ${qualityLine(s)}
      <span class="dim">·</span><span class="tip" title="Direction probability">P(dir) <b class="mono">${(s.p_direction*100).toFixed(0)}%</b></span>
      <span class="tip" title="Fast-family lean">${sentBadge(s.lean)}</span>
    </div>
    <details><summary class="dim" style="font-size:11px;cursor:pointer">Provisional setup (reference — full gates still computing)</summary><div style="margin-top:6px">${setupGrid({...s,max_loss_usd:s.max_loss_usd})}</div></details>
    ${scenariosHtml(s.scenarios)}
    ${dataQualityRow(s)}
    <div class="hl" style="margin-top:8px">${esc(s.note||'')}</div>${prov(s.provenance)}`;
  $('#ov-fam-status').innerHTML='<span class="badge b-stale" style="padding:0 5px">2 of 9</span>';
  $('#ov-fam').innerHTML=famBars(s.fast_families||[])
    +`<div class="dim2" style="font-size:10px;margin-top:10px">⏳ computing: ${(s.pending_families||[]).join(', ')}</div>`;
}
function renderOverviewDeep(r){
  const dc={TRADEABLE:'b-bull',MONITOR:'b-neut',REJECT:'b-bear'}[r.decision]||'b-neut';
  const isReject=r.decision==='REJECT', isMon=r.decision==='MONITOR';
  const lab={TRADEABLE:'✓ TRADEABLE',MONITOR:'◐ MONITOR',REJECT:'⛔ NO TRADE'}[r.decision]||esc(r.decision);
  $('#ov-status').innerHTML=ovStatusBadge('complete',0);
  const fails=(r.decision_gates||[]).filter(g=>!g.passed);
  const hardFails=fails.filter(g=>g.blocking), softFails=fails.filter(g=>!g.blocking);
  const head=`<div class="flexrow" style="margin-bottom:12px;flex-wrap:wrap;gap:8px;align-items:center">
      <span class="badge ${dc}" style="font-size:12px">${lab}</span>
      ${qualityLine(r)}
      <span class="dim">·</span><span class="tip" title="Probability the direction is right">P(dir) <b class="mono">${(r.p_direction*100).toFixed(0)}%</b></span>
      <span class="tip" title="Prob. the trade is net profitable after costs">P(profit) <b class="mono">${r.p_trade_profitable!=null?(r.p_trade_profitable*100).toFixed(0)+'%':'–'}</b></span>
      ${r.freshness?freshBadge(r.freshness):''}
    </div>`;
  let body='';
  if(isReject){
    body=`<div class="alert bad" style="margin-bottom:10px"><span>⛔</span><span><b>No trade.</b> ${hardFails.length} mandatory gate${hardFails.length===1?'':'s'} failed: ${hardFails.map(g=>esc(GATE_LABEL[g.name]||g.name)).join(' · ')||'—'}</span></div>
      <div class="dim" style="font-size:11px;margin-bottom:4px">WHAT MUST CHANGE</div>
      ${(r.upgrade_conditions||[]).map(c=>`<div style="font-size:11px">→ ${esc(c)}</div>`).join('')||'<span class="dim">—</span>'}
      <details style="margin-top:10px"><summary class="dim" style="font-size:11px;cursor:pointer">Hypothetical setup — NOT actionable (shown for reference only)</summary>
        <div style="margin-top:6px">${setupGrid(r)}${maxLossHtml(r)}</div></details>`;
  } else if(isMon){
    body=`<div class="alert" style="margin-bottom:10px;border-color:var(--amber)"><span>◐</span><span><b>Monitoring — not yet actionable.</b> All mandatory gates pass, but ${softFails.length} confirmation${softFails.length===1?'':'s'} pending. This is NOT an active trade.</span></div>
      <div class="dim" style="font-size:11px;margin-bottom:4px">PENDING CONFIRMATION</div>
      ${softFails.map(g=>`<div style="font-size:11px">◦ <b>${esc(GATE_LABEL[g.name]||g.name)}:</b> ${esc(g.reason)} <span class="dim2">(needs ${esc(g.requirement)})</span></div>`).join('')||'<span class="dim">—</span>'}
      <div class="grid c12" style="gap:10px;margin-top:10px">
        <div class="span6"><div class="dim" style="font-size:11px;margin-bottom:4px">▲ UPGRADE TO TRADEABLE IF</div>${(r.upgrade_conditions||[]).map(c=>`<div class="green" style="font-size:11px">→ ${esc(c)}</div>`).join('')||'<span class="dim">—</span>'}</div>
        <div class="span6"><div class="dim" style="font-size:11px;margin-bottom:4px">▼ DOWNGRADE TO NO-TRADE IF</div>${(r.avoid_if||[]).map(c=>`<div class="red" style="font-size:11px">→ ${esc(c)}</div>`).join('')||'<span class="dim">—</span>'}</div>
      </div>
      <details style="margin-top:10px"><summary class="dim" style="font-size:11px;cursor:pointer">Watch levels — reference only, do not enter until confirmed</summary>
        <div style="margin-top:6px">${setupGrid(r)}${maxLossHtml(r)}</div></details>`;
  } else {
    body=`${setupGrid(r)}${maxLossHtml(r)}`;
  }
  const opt=r.option?`<div style="margin-top:12px" class="card"><b>Option overlay</b> <span class="badge ${r.option.verdict.includes('OK')?'b-bull':'b-bear'}">${esc(r.option.verdict)}</span>
      <div class="dim" style="margin-top:5px;font-size:11px">${esc(r.option.contract)} · EV/contract ${money(r.option.ev_per_contract)} · spread ${r.option.spread_pct}% · θ-drag ${r.option.theta_drag}</div></div>`:'';
  const signals=`<div style="margin-top:12px"><div class="dim" style="font-size:11px;margin-bottom:4px">SUPPORTING</div>${(r.supporting_signals||[]).map(x=>`<div class="green" style="font-size:11px">▲ ${esc(x)}</div>`).join('')||'<span class="dim">none</span>'}
    <div class="dim" style="font-size:11px;margin:8px 0 4px">CONFLICTING</div>${(r.conflicting_signals||[]).map(x=>`<div class="red" style="font-size:11px">▼ ${esc(x)}</div>`).join('')||'<span class="dim">none</span>'}</div>`;
  const changed=r.what_changed&&r.what_changed.state==='ok'&&(r.what_changed.changes||[]).length?`<div class="alert" style="margin-top:10px;border-color:var(--accent)"><span>Δ</span><span>Since last analysis (${ago(Math.round((Date.now()-new Date(r.what_changed.since))/1000))} ago): ${r.what_changed.changes.map(esc).join(' · ')}</span></div>`:(r.what_changed&&r.what_changed.state==='first_run'?`<div class="dim" style="font-size:11px;margin-top:9px">Δ First analysis on record — subsequent runs will highlight what changed.</div>`:(r.what_changed&&r.what_changed.state==='unchanged'?`<div class="dim" style="font-size:11px;margin-top:9px">Δ No material change since last analysis.</div>`:''));
  $('#ov-main').innerHTML=head+body+opt+signals+disagreementHtml(r.disagreement)+gatesHtml(r)+evBreakdownHtml(r)+scenariosHtml(r.scenarios)+dataQualityRow(r)+changed+prov(r.provenance);
  $('#ov-fam-status').innerHTML='<span class="badge b-fresh" style="padding:0 5px">9 of 9</span>';
  $('#ov-fam').innerHTML=famBars(r.explain||[])
    +((r.missing_data||[]).length?`<div class="dim2" style="font-size:10px;margin-top:8px">No data: ${r.missing_data.map(esc).join(', ')}</div>`:'');
}

  skel($('#ta-ind'),7);const chEl=$('#ch');skel(chEl,6);
  const [h,t]=await Promise.all([api('/api/symbol/chart?range='+state.tf+'&symbol='+encodeURIComponent(state.ticker)),
    api('/api/symbol/technicals?symbol='+encodeURIComponent(state.ticker))]);
  if(h.state==='loading'||t.state==='loading')retryTab();
  if(h.state==='ok')drawPrice(chEl,h);else chEl.innerHTML=stateBox(h,'tabTechnicals()');

  const ms=t.market_sentiment||{};const rsi=(t.rsi?.value)??t.rsi;const atr=(t.atr?.value)??t.atr;
  const rows=[['Trend',t.trend_state,''],['Signal',ms.buy_sell_signal,''],['Momentum',ms.momentum,''],
    ['RSI (14)',num(rsi,1),rsi>70?'red':rsi<30?'green':''],['ATR',num(atr,2),''],
    ['ATR %',num((t.atr?.percent_of_price),2)+'%',''],['ADX',num(t.adx?.value??t.adx,1),'']];
  $('#ta-ind').innerHTML=rows.map(([k,val,c])=>`<div class="kv"><span class="k tip" title="${esc(k)}">${k}</span><span class="v ${c}">${esc(val??'–')}</span></div>`).join('')
    +(t.degraded?`<div class="prov"><span class="dot a"></span>${esc(t.degraded)}</div>`:'')+prov(t.provenance);
}

  const vals=curve.map(p=>p.equity),min=Math.min(...vals),max=Math.max(...vals),W=900,H=150,pad=8;
  const span=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1||1)*(W-2*pad)+pad).toFixed(1)},${(H-pad-(v-min)/span*(H-2*pad)).toFixed(1)}`).join(' ');
  const up=vals[vals.length-1]>=vals[0];
  elm.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    <defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${up?'#2bd07c':'#fb4d5f'}" stop-opacity=".28"/><stop offset="1" stop-color="${up?'#2bd07c':'#fb4d5f'}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${pad},${H-pad} ${pts} ${W-pad},${H-pad}" fill="url(#eqg)"/>

    <div class="dim2" style="font-size:10px;padding:0 6px">${curve.length} snapshots · low ${money(min)} · high ${money(max)} · latest ${money(vals[vals.length-1])}</div>`;
}

   <div class="kv"><span class="k">Cache hit / stale / miss</span><span class="v">${s.hit} / ${s.stale} / ${s.miss}</span></div>
   <div class="kv"><span class="k">Payload total</span><span class="v">${(s.bytes/1024).toFixed(1)} KB</span></div>
   <div class="kv"><span class="k">Client cache / inflight</span><span class="v">${DL.cache.size} / ${DL.inflight.size}</span></div>
   <div class="kv"><span class="k">Polling</span><span class="v">${document.hidden?'PAUSED (tab hidden)':pollMs/1000+'s'}</span></div>
   <div class="dim" style="margin:8px 0 4px">BACKEND cache: hit ${d.cache?.hit||0} · stale ${d.cache?.stale||0} · miss ${d.cache?.miss||0} · entries ${d.cache_entries||0}</div>
   <table><thead><tr><th>Slowest stage</th><th>avg</th><th>max</th><th>n</th></tr></thead><tbody>
   ${slow.map(x=>`<tr><td style="text-align:left">${esc(x.stage)}</td><td>${x.avg_ms}ms</td><td class="${x.max_ms>1000?'red':x.max_ms>300?'amber':''}">${x.max_ms}ms</td><td>${x.n}</td></tr>`).join('')}
   </tbody></table>`;
}

// ═══════════════ KEYBOARD ═══════════════
const NAV=['trading','home','scanner','stock','catalysts','news','scheduler','settings'];
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='/'){e.preventDefault();$('#search').focus();}
  else if(e.key==='r'){refreshCritical();go(state.view);}
  else if(e.key==='a'){state.account=state.account==='paper'?'cash':'paper';save();$$('#acctSeg button').forEach(x=>x.classList.toggle('on',x.dataset.a===state.account));loadStrip();}
  else if(e.key==='o'){state.tab='options';save();go('stock');}
  else if(e.key==='h'){openHealth();}
  else if(e.key==='p'){togglePerf();}
  else if(e.key==='Escape'){closeDrawer();closeHealth();}
  else if(e.key>='1'&&e.key<='8'){go(NAV[+e.key-1]);}
});

// ═══════════════ POLLING (visibility-aware, single loop) ═══════════════
const pollMs=15000; let _poll=null;
function refreshCritical(){['/api/state','/api/market','/api/trading'].forEach(u=>DL.cache.delete(u));loadStrip();loadMarket();if(state.view==='trading')renderTrading();}
function startPolling(){stopPolling();_poll=setInterval(()=>{if(document.hidden)return;loadStrip();loadMarket();if(state.view==='trading')renderTrading();},pollMs);}
function stopPolling(){if(_poll)clearInterval(_poll);_poll=null;}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){stopPolling();} else {refreshCritical();startPolling();} });

// ═══════════════ BOOT ═══════════════
loadStrip();loadMarket();go(state.view);startPolling();
</script>
</body>
</html>
