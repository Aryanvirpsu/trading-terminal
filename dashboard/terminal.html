function renderCohortIntel(){
  if(!cohortIntel){loadCohortIntel();return skel(5);}
  if(cohortIntel.__err)return emptyBox('⚠','Intelligence unavailable',cohortIntel.__err);
  const rp=(cohortIntel.rank||{}).groups||{}, sb=(cohortIntel.score_bucket||{}).groups||{},
        st=(cohortIntel.setup_type||{}).groups||{}, rep=(cohortIntel.repetition||{}).symbols||[];
  const grpTable=(title,groups,order)=>{
    const keys=(order||Object.keys(groups).sort()).filter(k=>groups[k]);
    if(!keys.length)return '';
    const rows=keys.map(k=>{
      const g=groups[k];
      return `<tr><td>${esc(k)}</td><td>${g.n}</td><td class="${cls(g.avg_return_pct)}">${pct(g.avg_return_pct)}</td>
        <td>${g.hit_rate_pct}%</td><td class="${cls(g.avg_alpha_pct)}">${g.avg_alpha_pct!=null?pct(g.avg_alpha_pct):'–'}</td></tr>`;
    }).join('');
    return `<div class="sec">${title} <span class="dim2">(${cohortIntel.horizon})</span></div>
      <table><thead><tr><th>Group</th><th>N</th><th>Avg ret</th><th>Hit%</th><th>Alpha</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  };
  const repWarn=rep.filter(r=>r.repeated_candidate_warning);
  const repBody=rep.length?`<table><thead><tr><th>Sym</th><th>Seen</th><th>Rate</th><th>Streak</th>
      <th>Avg rank</th><th>Avg 5d</th></tr></thead><tbody>`+
    rep.slice(0,15).map(r=>`<tr ${r.repeated_candidate_warning?'style="background:rgba(240,180,41,.08)"':''}>
      <td>${esc(r.symbol)}</td><td>${r.appearances}</td><td>${Math.round(r.appearance_rate*100)}%</td>
      <td>${r.consecutive_streak}</td><td>${r.avg_rank}</td>
      <td class="${cls(r.avg_5d_return_pct)}">${r.avg_5d_return_pct!=null?pct(r.avg_5d_return_pct):'–'}</td></tr>`).join('')+
    `</tbody></table>`:emptyBox('○','No repetition data yet','');
  return (grpTable('Return by rank',rp)||emptyBox('○','No performance data yet',
      'Once observations have 5+ trading days of history, rank/score/setup performance appears here.')) +
    grpTable('Return by score bucket',sb,['0-59','60-69','70-79','80-100']) +
    grpTable('Return by setup type',st) +
    `<div class="sec">Repeated-candidate diagnostic ${repWarn.length?`<span class="badge b-stale" style="padding:0 3px">${repWarn.length} flagged</span>`:''}</div>` +
    repBody +
    `<div class="note" style="margin-top:6px">${cohortIntel.repetition?cohortIntel.repetition.scans_considered:0} scans considered · sample sizes below ~12 are indicative only</div>`;
}

/* ── 2. CHART — canvas, live current candle, zoom/pan/crosshair ──────────────
   Three data streams, deliberately separate (the whole point of the refresh split):

     HISTORY  the `chart` section — fetched ONCE per (symbol, timeframe)
     LIVE     the `quote` section — a price, polled on its own cadence
     LEVELS   the `levels` section — annotation only, never touches the Y scale

   A new quote UPDATES the current candle in place; it never appends a bar and never
   re-pulls history. A new bar appears only when the interval actually rolls over. */
const ChartView={
  host:null, cv:null, ctx:null, ro:null, dpr:1,
  bars:[], meta:{}, live:null, liveBar:null,
  view:null,            // {i0,i1} visible index window; null = auto (show all)
  hover:null, raf:0, drag:null,
  key:'',               // symbol|timeframe the loaded bars belong to

  /* history arrives (or the symbol/timeframe changed) */
  setData(bars,meta,key){
    const fresh=(key!==this.key);
    this.bars=bars||[]; this.meta=meta||{}; this.key=key;
    if(fresh){this.view=null; this.liveBar=null;}   // reset zoom on a real change only
    this.schedule();
  },
  /* a live quote arrives — mutate the current candle, or roll a new one */
  setLive(q){
    this.live=q||null;
    if(!q||q.price==null||!this.bars.length){this.schedule();return}
    const secs=this.meta.bar_seconds||86400;
    const last=this.bars[this.bars.length-1];
    const lastT=Date.parse(last.t)/1000;
    const qT=q.source_timestamp?Date.parse(q.source_timestamp)/1000:Date.now()/1000;
    if(!isFinite(lastT)){this.schedule();return}
    if(qT>=lastT+secs){
      // interval rolled over → ONE new candle seeded from the quote
      const bt=new Date((Math.floor(qT/secs)*secs)*1000).toISOString();
      this.liveBar={t:bt,o:q.price,h:q.price,l:q.price,c:q.price,v:0,_live:true};
    }else{
      // same interval → update O/H/L/C of the bar in place
      const base=this.liveBar&&this.liveBar.t===last.t?this.liveBar:{...last};
      base.c=q.price;
      base.h=Math.max(base.h??q.price,q.price);
      base.l=Math.min(base.l??q.price,q.price);
      base._live=true;
      this.liveBar=base;
    }
    this.schedule();
  },
  /* history + the live candle merged for drawing */
  series(){
    if(!this.liveBar||!this.bars.length)return this.bars;
    const last=this.bars[this.bars.length-1];
    return this.liveBar.t===last.t
      ? this.bars.slice(0,-1).concat([this.liveBar])
      : this.bars.concat([this.liveBar]);
  },
  window(){
    const n=this.series().length;
    if(!n)return {i0:0,i1:0};
    if(!this.view)return {i0:0,i1:n-1};
    return {i0:Math.max(0,Math.min(this.view.i0,n-2)),i1:Math.min(n-1,Math.max(this.view.i1,1))};
  },
  mount(host){
    if(this.host===host&&this.cv&&host.contains(this.cv))return;
    this.host=host;
    host.innerHTML='';
    const cv=document.createElement('canvas');
    cv.style.cssText='display:block;width:100%;height:100%;cursor:crosshair';
    host.appendChild(cv);
    this.cv=cv; this.ctx=cv.getContext('2d');
    this.wire();
    // ResizeObserver: the chart re-fits itself from cached data. No fetch, ever.
    if(this.ro)this.ro.disconnect();
    this.ro=new ResizeObserver(()=>this.schedule());
    this.ro.observe(host);
  },
  schedule(){
    if(this.raf)return;
    // requestAnimationFrame is throttled to nothing in a background or
    // non-compositing tab. A pending callback that never fires would leave `raf`
    // truthy and wedge the scheduler for good — the chart would silently stop
    // redrawing and never recover. Race the frame against a timer so a draw always
    // lands, whichever wins.
    this.raf=1;
    const run=()=>{
      if(!this.raf)return;
      this.raf=0;
      cancelAnimationFrame(this.rafId); clearTimeout(this.rafT);
      this.draw();
    };
    this.rafId=requestAnimationFrame(run);
    this.rafT=setTimeout(run,250);
  },
  wire(){
    const cv=this.cv;
    cv.onwheel=e=>{
      e.preventDefault();
      const s=this.series(); if(s.length<3)return;
      const {i0,i1}=this.window();
      const g=this.geom(); if(!g)return;
      const frac=Math.max(0,Math.min(1,(e.offsetX-g.padL)/Math.max(1,g.iw)));
      const anchor=i0+frac*(i1-i0);
      const span=(i1-i0)||1;
      const next=Math.max(8,Math.min(s.length-1,Math.round(span*(e.deltaY>0?1.25:0.8))));
      let a=Math.round(anchor-frac*next), b=a+next;
      if(a<0){a=0;b=next}
      if(b>s.length-1){b=s.length-1;a=Math.max(0,b-next)}
      this.view={i0:a,i1:b}; this.schedule();
    };
    cv.onpointerdown=e=>{
      if(e.button!==0)return;
      // pan must not fight the widget's own resize/move handles
      e.stopPropagation();
      const {i0,i1}=this.window();
      this.drag={x:e.clientX,i0,i1};
      try{cv.setPointerCapture(e.pointerId)}catch(_){}
    };
    cv.onpointermove=e=>{
      const r=cv.getBoundingClientRect();
      this.hover={x:e.clientX-r.left,y:e.clientY-r.top};
      if(this.drag){
        const g=this.geom();
        if(g){
          const span=this.drag.i1-this.drag.i0;
          const perPx=span/Math.max(1,g.iw);
          const shift=Math.round((this.drag.x-e.clientX)*perPx);
          const n=this.series().length;
          let a=this.drag.i0+shift,b=this.drag.i1+shift;
          if(a<0){b-=a;a=0}
          if(b>n-1){a-=(b-(n-1));b=n-1}
          this.view={i0:Math.max(0,a),i1:Math.min(n-1,b)};
        }
      }
      this.schedule();
    };
    const up=e=>{if(this.drag){this.drag=null}};
    cv.onpointerup=up; cv.onpointercancel=up;
    cv.onpointerleave=()=>{this.hover=null;this.drag=null;this.schedule()};
    cv.ondblclick=e=>{e.stopPropagation();this.view=null;this.schedule()};  // auto scale
  },
  geom(){
    const host=this.host; if(!host)return null;
    const W=host.clientWidth, H=host.clientHeight;
    if(W<60||H<50)return null;
    const padL=6, padR=54, padT=16, padB=18;
    const volH=Math.round(Math.max(24,Math.min(H*0.20,H*0.20)));   // 20% of height
    const iw=W-padL-padR, ih=H-padT-padB-volH-6;
    if(iw<30||ih<24)return null;
    return {W,H,padL,padR,padT,padB,volH,iw,ih};
  },
  draw(){
    const g=this.geom(); const cv=this.cv, ctx=this.ctx;
    if(!g||!cv||!ctx)return;
    // device-pixel scaling: without this the canvas is blurry on any HiDPI screen
    const dpr=window.devicePixelRatio||1;
    if(cv.width!==Math.round(g.W*dpr)||cv.height!==Math.round(g.H*dpr)){
      cv.width=Math.round(g.W*dpr); cv.height=Math.round(g.H*dpr);
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,g.W,g.H);
    const css=getComputedStyle(document.documentElement);
    const C={border:css.getPropertyValue('--border').trim()||'#1d2836',
             dim:css.getPropertyValue('--dim2').trim()||'#54606f',
             text:css.getPropertyValue('--text').trim()||'#d9e1ec',
             green:css.getPropertyValue('--green').trim()||'#2bd07c',
             red:css.getPropertyValue('--red').trim()||'#fb4d5f',
             accent:css.getPropertyValue('--accent').trim()||'#4c8dff',
             amber:css.getPropertyValue('--amber').trim()||'#f0b429',
             panel:css.getPropertyValue('--panel').trim()||'#0f151e'};
    ctx.font='9px ui-monospace,Menlo,Consolas,monospace';
    ctx.textBaseline='middle';

    const s=this.series();
    if(s.length<2){
      ctx.fillStyle=C.dim; ctx.textAlign='center';
      ctx.fillText('no price history',g.W/2,g.H/2); return;
    }
    const {i0,i1}=this.window();
    const vis=s.slice(i0,i1+1);
    const n=vis.length;

    // ── Y SCALE from the VISIBLE CANDLES ONLY. Trade levels annotate; they never
    // stretch the axis, so a far target cannot compress the price action. ──
    let lo=Infinity,hi=-Infinity;
    for(const b of vis){lo=Math.min(lo,b.l??b.c);hi=Math.max(hi,b.h??b.c)}
    if(!isFinite(lo)||!isFinite(hi)||hi<=lo){lo=(lo||1)*0.99;hi=(hi||1)*1.01}
    const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
    const dp=(hi-lo)>=100?0:(hi-lo)>=10?1:2;
    const X=i=>g.padL+(n===1?g.iw/2:(i/(n-1))*g.iw);
    const Y=v=>g.padT+g.ih-((v-lo)/(hi-lo))*g.ih;
    const maxV=Math.max(1,...vis.map(b=>b.v||0));
    const volTop=g.padT+g.ih+6;
    const VY=v=>volTop+g.volH-(v/maxV)*g.volH;
    const cw=Math.max(1,Math.min(9,g.iw/n*0.7));

    // grid + right price axis
    ctx.strokeStyle=C.border; ctx.lineWidth=1; ctx.textAlign='left'; ctx.fillStyle=C.dim;
    for(let k=0;k<=4;k++){
      const v=lo+(hi-lo)*k/4, y=Math.round(Y(v))+0.5;
      ctx.beginPath(); ctx.moveTo(g.padL,y); ctx.lineTo(g.padL+g.iw,y); ctx.stroke();
      ctx.fillText(v.toFixed(dp),g.padL+g.iw+5,y);
    }

    // volume, aligned to the same X as its candle
    for(let k=0;k<n;k++){
      const b=vis[k]; const up=(b.c>=b.o);
      ctx.fillStyle=up?'rgba(43,208,124,.28)':'rgba(251,77,95,.28)';
      const y=VY(b.v||0);
      ctx.fillRect(X(k)-cw/2,y,cw,volTop+g.volH-y);
    }
    ctx.strokeStyle=C.border; ctx.beginPath();
    ctx.moveTo(g.padL,volTop-3+0.5); ctx.lineTo(g.padL+g.iw,volTop-3+0.5); ctx.stroke();

    // candles
    for(let k=0;k<n;k++){
      const b=vis[k]; const up=(b.c>=b.o); const col=up?C.green:C.red;
      const x=X(k);
      ctx.strokeStyle=col; ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(Math.round(x)+0.5,Y(b.h??Math.max(b.o,b.c)));
      ctx.lineTo(Math.round(x)+0.5,Y(b.l??Math.min(b.o,b.c)));
      ctx.stroke();
      const yo=Y(b.o),yc=Y(b.c);
      ctx.fillRect(x-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)));
      if(b._live){ctx.strokeStyle=C.accent;ctx.lineWidth=1;
        ctx.strokeRect(x-cw/2-1,Math.min(yo,yc)-1,cw+2,Math.max(1,Math.abs(yc-yo))+2);ctx.lineWidth=1}
    }

    // moving averages, computed over the FULL series so the left edge is not truncated
    const MA=[[20,'#4c8dff'],[50,'#f0b429'],[200,'#8b5cf6']];
    for(const [p,col] of MA){
      if(!state.chartMA||!state.chartMA[p])continue;
      if(s.length<p)continue;
      ctx.strokeStyle=col; ctx.lineWidth=1.1; ctx.beginPath();
      let started=false;
      for(let k=0;k<n;k++){
        const gi=i0+k; if(gi+1<p)continue;
        let sum=0; for(let j=gi+1-p;j<=gi;j++)sum+=s[j].c;
        const y=Y(sum/p);
        if(!started){ctx.moveTo(X(k),y);started=true}else ctx.lineTo(X(k),y);
      }
      ctx.stroke(); ctx.lineWidth=1;
    }

    // ── trade levels: annotation only. Anything outside the visible price range is
    // pinned to the edge with an arrow rather than being allowed to rescale it. ──
    const lv=((Snap.sec('levels')||{}).data)||{};
    if(state.ovLevels!==false&&lv.state==='ok'){
      const ez=lv.entry_zone;
      if(Array.isArray(ez)&&ez.length===2){
        const y1=Y(Math.max(ez[0],ez[1])), y2=Y(Math.min(ez[0],ez[1]));
        if(y2>g.padT&&y1<g.padT+g.ih){
          ctx.fillStyle='rgba(76,141,255,.10)';
          ctx.fillRect(g.padL,Math.max(g.padT,y1),g.iw,Math.max(1,Math.min(g.padT+g.ih,y2)-Math.max(g.padT,y1)));
        }
      }
      const marks=[[lv.invalidation,C.red,'STOP'],[lv.target_1,C.green,'T1'],[lv.target_2,C.green,'T2']];
      ctx.textAlign='right';
      for(const [v,col,lab] of marks){
        if(v==null)continue;
        if(v>=lo&&v<=hi){
          const y=Math.round(Y(v))+0.5;
          ctx.strokeStyle=col; ctx.setLineDash([4,3]); ctx.beginPath();
          ctx.moveTo(g.padL,y); ctx.lineTo(g.padL+g.iw,y); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle=col; ctx.fillText(`${lab} ${v.toFixed(2)}`,g.padL+g.iw-3,y-6);
        }else{
          const above=v>hi;
          const y=above?g.padT+7:g.padT+g.ih-7;
          ctx.fillStyle=col;
          ctx.fillText(`${above?'↑':'↓'} ${lab} ${v.toFixed(2)}`,g.padL+g.iw-3,y);
        }
      }
      ctx.textAlign='left';
    }

    // current price marker on the right axis
    const lastBar=s[s.length-1];
    const lastPx=(this.live&&this.live.price!=null)?this.live.price:lastBar.c;
    if(lastPx>=lo&&lastPx<=hi){
      const y=Math.round(Y(lastPx))+0.5;
      const live=chartLiveState().live;
      ctx.strokeStyle=live?C.accent:C.dim; ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(g.padL,y); ctx.lineTo(g.padL+g.iw,y); ctx.stroke();
      ctx.setLineDash([]);
      const label=lastPx.toFixed(dp);
      const tw=ctx.measureText(label).width+8;
      ctx.fillStyle=live?C.accent:C.dim;
      ctx.fillRect(g.padL+g.iw+2,y-7,tw,14);
      ctx.fillStyle='#04101f'; ctx.fillText(label,g.padL+g.iw+6,y);
    }

    // x axis dates
    ctx.fillStyle=C.dim; ctx.textAlign='left';
    ctx.fillText(fmtBarTime(vis[0].t,this.meta.interval),g.padL,g.H-8);
    ctx.textAlign='right';
    ctx.fillText(fmtBarTime(vis[n-1].t,this.meta.interval),g.padL+g.iw,g.H-8);

    // legend
    ctx.textAlign='left'; ctx.fillStyle=C.dim;
    const on=MA.filter(([p])=>state.chartMA&&state.chartMA[p]).map(([p])=>p);
    ctx.fillText(`${this.meta.interval||''} · ${vis.length}/${s.length} bars${on.length?' · MA '+on.join('/'):''}`,g.padL,g.padT-8);

    if(this.hover)this.crosshair(g,C,vis,X,Y,lo,hi,dp,i0);
  },
  crosshair(g,C,vis,X,Y,lo,hi,dp,i0){
    const ctx=this.ctx, {x,y}=this.hover;
    if(x<g.padL||x>g.padL+g.iw)return;
    const n=vis.length;
    const k=Math.max(0,Math.min(n-1,Math.round(((x-g.padL)/Math.max(1,g.iw))*(n-1))));
    const b=vis[k]; if(!b)return;
    const cx=X(k);
    ctx.strokeStyle=C.dim; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(Math.round(cx)+0.5,g.padT); ctx.lineTo(Math.round(cx)+0.5,g.padT+g.ih+6+g.volH); ctx.stroke();
    if(y>=g.padT&&y<=g.padT+g.ih){
      ctx.beginPath(); ctx.moveTo(g.padL,Math.round(y)+0.5); ctx.lineTo(g.padL+g.iw,Math.round(y)+0.5); ctx.stroke();
      const v=lo+(1-(y-g.padT)/g.ih)*(hi-lo);
      const t=v.toFixed(dp), tw=ctx.measureText(t).width+8;
      ctx.setLineDash([]);
      ctx.fillStyle=C.dim; ctx.fillRect(g.padL+g.iw+2,y-7,tw,14);
      ctx.fillStyle='#04101f'; ctx.fillText(t,g.padL+g.iw+6,y);
    }
    ctx.setLineDash([]);
    // OHLCV tooltip
    const ma=[];
    for(const p of [20,50,200]){
      if(!state.chartMA||!state.chartMA[p])continue;
      const s=this.series(), gi=i0+k;
      if(gi+1>=p){let sum=0;for(let j=gi+1-p;j<=gi;j++)sum+=s[j].c;ma.push(`MA${p} ${(sum/p).toFixed(dp)}`)}
    }
    const lines=[fmtBarTime(b.t,this.meta.interval),
                 `O ${b.o?.toFixed(dp)}  H ${b.h?.toFixed(dp)}`,
                 `L ${b.l?.toFixed(dp)}  C ${b.c?.toFixed(dp)}`,
                 `V ${kmb(b.v)}`].concat(ma);
    ctx.font='9px ui-monospace,Menlo,Consolas,monospace';
    const wpx=Math.max(...lines.map(l=>ctx.measureText(l).width))+12;
    const hpx=lines.length*12+8;
    let bx=cx+10; if(bx+wpx>g.padL+g.iw)bx=cx-10-wpx;
    const by=Math.min(g.padT+4,g.padT+g.ih-hpx);
    ctx.fillStyle='rgba(11,16,23,.94)'; ctx.strokeStyle=C.border;
    ctx.fillRect(bx,by,wpx,hpx); ctx.strokeRect(bx+0.5,by+0.5,wpx,hpx);
    ctx.fillStyle=C.text; ctx.textAlign='left';
    lines.forEach((l,idx)=>ctx.fillText(l,bx+6,by+12+idx*12));
  }
};
function fmtBarTime(t,interval){
  const d=new Date(t); if(isNaN(d))return String(t||'').slice(0,10);
  const intraday=interval&&/m|h/.test(interval);
  return intraday
    ? d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
    : d.toISOString().slice(0,10);
}
/* Market-state truth for the chart badge. Derived from the CANONICAL market clock plus
   the quote's own typed freshness — never from "an endpoint returned a number". */
function chartLiveState(){
  const q=Snap.sec('quote')||{};
  const mkt=((Snap.data||{}).market||{}).state||((Status||{}).market||{}).state;
  const fr=q.freshness||{};
  const age=fr.age_seconds;
  if(q.state!=='ok')return {label:'STALE',cls:'b-critical',live:false};
  const open=(mkt==='open'||mkt==='premarket'||mkt==='afterhours');
  if(!open)return {label:'CLOSED · LAST',cls:'b-info',live:false};
  if(fr.presentation==='STALE · REFRESH FAILED')return {label:'STALE',cls:'b-critical',live:false};
  if(fr.presentation==='DELAYED')return {label:'DELAYED · '+ago(age),cls:'b-stale',live:false};
  if(fr.presentation==='LIVE')return {label:'LIVE · '+ago(age),cls:'b-fresh',live:true};
  return {label:'UNKNOWN',cls:'b-neut',live:false};
}

function renderChart(b){
  const sec=Snap.sec('chart');
  const tfs=['1D','5D','1M','3M','6M','1Y'].map(t=>`<button class="pill-btn ${state.tf===t?'on':''}" data-tf="${t}">${t}</button>`).join('');
  if(!state.chartMA)state.chartMA={20:true,50:true,200:false};
  const ls=chartLiveState();
  const maBtns=[20,50,200].map(p=>`<button class="pill-btn ${state.chartMA[p]?'on':''}" data-ma="${p}" style="padding:2px 5px">${p}</button>`).join('');
  const bar=`<div class="flexrow" style="margin-bottom:4px">${tfs}
    <span class="badge ${ls.cls}" title="Derived from the market calendar and the quote's own freshness, never from a bare price">${esc(ls.label)}</span>
    <span class="spacer"></span>${maBtns}
    <button class="pill-btn ${state.ovLevels!==false?'on':''}" data-lv="1" style="padding:2px 6px">levels</button>
    <button class="pill-btn" data-auto="1" style="padding:2px 6px" title="Auto scale (or double-click the chart)">auto</button></div>`;
  whead('chart','chart');
  const box=sectionBox(sec,'chart');
  if(box){b.innerHTML=bar+box;wireChartBar(b);return}

  // Rebuild the shell only when it is missing — otherwise reuse the canvas so a
  // resize or a live tick does not thrash the DOM.
  let host=b.querySelector('.chost');
  if(!host){
    b.innerHTML=bar;
    host=document.createElement('div');
    host.className='chost';
    host.style.cssText='position:relative;height:calc(100% - 24px);min-height:90px';
    b.appendChild(host);
  }else{
    b.firstElementChild.outerHTML=bar;
    host=b.querySelector('.chost');
  }
  ChartView.mount(host);
  ChartView.setData(sec.data.points||[],sec.data,`${state.symbol}|${state.tf}`);
  const q=(Snap.sec('quote')||{}).data;
  if(q)ChartView.setLive(q);
  wireChartBar(b);
}
function wireChartBar(b){
  b.querySelectorAll('[data-tf]').forEach(x=>x.onclick=()=>{
    // Changing timeframe fetches the appropriate history — that IS a new dataset.
    state.tf=x.dataset.tf;save();ChartView.key='';DL.drop('/api/terminal/symbol');Snap.load(state.symbol);});
  b.querySelectorAll('[data-ma]').forEach(x=>x.onclick=()=>{
    const p=+x.dataset.ma;state.chartMA[p]=!state.chartMA[p];save();renderWidget('chart');});
  const lvb=b.querySelector('[data-lv]');
  if(lvb)lvb.onclick=()=>{state.ovLevels=(state.ovLevels===false);save();renderWidget('chart')};
  const ab=b.querySelector('[data-auto]');
  if(ab)ab.onclick=()=>{ChartView.view=null;ChartView.schedule()};
}

/* ── 3. TRADE DECISION — persistent header + compact evidence tabs ───────────
   Everything that used to sit behind an accordion is one click away in a tab. The
   header (verdict, the four scores, levels, size, the four risk numbers) is sticky
   and survives every tab switch and every ticker change. No <details> anywhere in
   this widget: primary decision evidence must never need a disclosure triangle. */
const DEC_TABS=[['overview','Overview'],['thesis','Thesis'],['history','History'],
                ['news','News'],['risk','Risk'],['option','Option']];
// Which snapshot section each tab reads, so a tab reports its OWN state instead of
// the widget blocking on its slowest dependency.
const DEC_TAB_SECTION={overview:'decision',thesis:'decision',history:'history',
                       news:'news',risk:'risk',option:'options'};
function decTabState(t){const s=Snap.sec(DEC_TAB_SECTION[t]);return s?(s.state||'loading'):'loading'}
// The long risk-policy rejection belongs in RISK, not permanently in OVERVIEW.
function shortReason(x){
  const s=String(x||'');
  if(s.length<=110)return s;
  const cut=s.indexOf(' — ');
  return (cut>0&&cut<110?s.slice(0,cut):s.slice(0,105))+' …';
}

function renderDecision(b){
  const sec=Snap.sec('decision');
  whead('decision','decision');
  const d=(sec&&sec.state==='ok')?(sec.data||{}):null;
  const tab=DEC_TABS.some(([k])=>k===state.decTab)?state.decTab:'overview';
  const tabsBar='<div class="dtabs">'+DEC_TABS.map(([k,l])=>{
      const st=decTabState(k);
      const mark=st==='loading'?'<span class="st amber" title="still computing">●</span>'
                :st==='ok'?'':'<span class="st dim2" title="'+esc(st)+'">○</span>';
      return `<button data-dtab="${k}" class="${k===tab?'on':''}">${esc(l)}${mark}</button>`;
    }).join('')+'</div>';
  b.className='wb pad0';
  b.innerHTML=`<div class="dtop">${decHeader(d,sec)}${tabsBar}</div>
    <div class="dpane">${decPane(tab,d)}</div>`;
  b.querySelectorAll('[data-dtab]').forEach(x=>x.onclick=()=>{
    state.decTab=x.dataset.dtab; save(); renderDecision(b);
  });
}

/* ── persistent header ── */
function decHeader(d,sec){
  if(!d){
    // The header may not invent a verdict it does not have — but the tabs below
    // stay usable, so news or history can be read while the decision computes.
    const st=sec&&sec.state;
    const msg=st==='loading'?'computing decision…':(sec&&sec.reason)||'decision unavailable';
    return `<div class="verdict v-no"><div class="vl dim">${st==='loading'?'◌':'—'}</div>
      <div class="vi dim2">${esc(msg)}</div></div>`;
  }
  if(d.gated){
    return `<div class="verdict v-stale">
      <div class="vl">STALE</div><div class="vi red">REFRESH REQUIRED</div>
      <div class="vr">A verdict is only as current as the oldest input behind it:
        ${esc((d.gate_reason||[]).join('; '))}</div>
      <button class="pill-btn" style="margin-top:6px" onclick="Snap.refresh()">⟳ Refresh ${esc(state.symbol)}</button>
      <div class="note" style="margin-top:5px">Withheld verdict was <b>${esc(d.instrument_withheld||'—')}</b> — shown so you know what changed, not as guidance.</div>
    </div>`;
  }
  const label=(d.decision||'').toUpperCase();
  const vcls=label==='TRADEABLE'?'v-go':label==='MONITOR'?'v-watch':'v-no';
  const inst=d.instrument||'—';
  const icls=inst==='OPTION PREFERRED'?'amber':inst==='STOCK PREFERRED'?'accent':'dim';
  const lv=d.levels&&d.levels.state==='ok'?d.levels:(((Snap.sec('levels')||{}).data)||{});
  const sz=d.sizing||{};
  const chosen=inst==='OPTION PREFERRED'?(sz.option||{}):(sz.shares||{});
  const rk=chosen.risk||{};
  const scale=d.score_scale||{};
  return `<div class="verdict ${vcls}">
      <div class="vl">${esc(label||'—')}</div>
      <div class="vi ${icls}">${esc(inst)}</div>
      <div class="flexrow" style="margin-top:5px">
        <span class="badge b-neut" title="${esc((d.label_reason||'')+' — structural + context, exactly.')}">Decision ${num(d.decision_score,1)}<span class="dim2">/${num(scale.max,0)}</span></span>
        <span class="badge b-neut" title="The setup itself. News and history cannot substitute for this.">Structure ${num(d.structural_score,1)}<span class="dim2">/${num(d.structural_max,0)}</span></span>
        <span class="badge ${(d.context_score||0)>=0?'b-fresh':'b-stale'}" title="News + catalysts + history. Bounded — it adjusts confidence, it cannot rescue a bad setup.">Context ${(d.context_score>=0?'+':'')}${num(d.context_score,1)}</span>
        ${d.setup_score!=null?`<span class="badge b-neut" title="The SCANNER's own funnel ranking, 0-100 — a different quantity on a different scale.">Setup ${num(d.setup_score,1)}<span class="dim2">/100</span></span>`:''}
      </div>
    </div>
    ${lv.state==='ok'?`<div class="g2" style="font-size:11px">
      <div class="kv"><span class="k">Entry</span><span class="v">${lv.entry_zone?num(lv.entry_zone[0],2)+'–'+num(lv.entry_zone[1],2):num(lv.reference_price,2)}</span></div>
      <div class="kv"><span class="k">Invalidation</span><span class="v red">${num(lv.invalidation,2)}</span></div>
      <div class="kv"><span class="k">Target 1</span><span class="v green">${num(lv.target_1,2)}</span></div>
      <div class="kv"><span class="k">Target 2</span><span class="v green">${num(lv.target_2,2)}</span></div>
      <div class="kv"><span class="k">R:R</span><span class="v">${num(lv.rr_target_1,2)}:1</span></div>
      <div class="kv"><span class="k">Position size</span><span class="v">${chosen.quantity!=null?esc(chosen.quantity)+(inst==='OPTION PREFERRED'?' ctr':' sh'):'—'}</span></div>
    </div>`:`<div class="note">${esc(lv.reason||'No tradeable levels — a stop cannot be placed objectively.')}</div>`}
    <div class="riskgrid">
      <div class="rc"><div class="l">Capital</div><div class="v">${money(rk.capital_committed)}</div></div>
      <div class="rc"><div class="l">Planned</div><div class="v amber">${money(rk.planned_risk)}</div></div>
      <div class="rc"><div class="l">Stress</div><div class="v amber">${money(rk.stress_risk)}</div></div>
      <div class="rc"><div class="l">Max loss</div><div class="v red">${money(rk.absolute_max_loss)}</div></div>
    </div>`;
}

/* ── pane dispatch: each tab owns its own loading/unavailable state ── */
function decPane(tab,d){
  const secName=DEC_TAB_SECTION[tab], sec=Snap.sec(secName);
  const label={overview:'decision',thesis:'decision',history:'historical validation',
               news:'news',risk:'account',option:'option chain'}[tab];
  const box=sectionBox(sec,label);
  if(box)return box;
  try{
    return ({overview:decOverview,thesis:decThesis,history:decHistory,
             news:decNews,risk:decRisk,option:decOption}[tab]||decOverview)(d);
  }catch(e){return emptyBox('⚠','Tab error',String(e.message||e))}
}

/* ── OVERVIEW: the fastest read ── */
function decOverview(d){
  if(!d)return emptyBox('◌','Decision computing…','');
  const th=((Snap.sec('thesis')||{}).data)||{};
  const rows=th.rows||[];
  return `${rows.length?`<div class="thesis">${rows.map(r=>
      `<div class="trow"><span class="k">${esc(r.row)}</span><span class="v ${thCls(r.value)}">${esc(r.value)}</span></div>`).join('')}</div>`
      :'<div class="note">thesis pending</div>'}
    ${(d.supports||[]).length?`<div class="sec">Why this setup</div>
      <ul class="rl">${d.supports.slice(0,3).map(x=>`<li class="pos">${esc(shortReason(x))}</li>`).join('')}</ul>`:''}
    ${(d.contradicts||[]).length?`<div class="sec">Watch</div>
      <ul class="rl">${d.contradicts.slice(0,3).map(x=>{
        const hard=/stale|invalid|liquidity|risk policy/i.test(x);
        const long=String(x).length>110;
        return `<li class="${hard?'blk':'neg'}">${esc(shortReason(x))}${long?' <span class="dim2">(Risk tab)</span>':''}</li>`;
      }).join('')}</ul>`:''}
    ${(d.hard_failures||[]).length?`<div class="sec">Hard failures</div>
      <ul class="rl">${d.hard_failures.map(h=>`<li class="blk"><b>${esc(String(h.kind).replace(/_/g,' '))}</b> — ${esc(shortReason(h.detail))}</li>`).join('')}</ul>
      <div class="note">A hard rule is not outvoted by news, catalysts or history.</div>`:''}`;
}

/* ── THESIS: why the setup exists ── */
function decThesis(d){
  if(!d)return emptyBox('◌','Decision computing…','');
  const lvS=((Snap.sec('levels')||{}).data)||{};
  const lv=d.levels&&d.levels.state==='ok'?d.levels:lvS;
  const setups=d.setups||[];
  const comp=n=>(d.components||[]).find(c=>c.component===n)||{};
  const line=(k,c)=>c.note?`<div class="kv" style="border:0;padding:3px 0 0"><span class="k">${k}</span>
      <span class="v ${c.score>0?'green':c.score<0?'red':'dim'}">${c.score>0?'+':''}${num(c.score,1)}</span></div>
      <div class="note" style="margin:0 0 5px">${esc(c.note)}</div>`:'';
  return `<div class="sec">Structure</div>
    ${line('Technical',comp('technical_quality'))}
    ${line('Setup quality',comp('setup_quality'))}
    ${line('Market regime',comp('market_regime'))}
    ${line('Execution',comp('execution_quality'))}
    <div class="sec">Scanner strategy</div>
    ${setups.length?setups.map(s=>`<div class="kv" style="border:0;padding:3px 0 0">
        <span class="k">${esc(String(s.type||'').replace(/_/g,' '))}</span>
        <span class="v">${num(s.strength,0)}<span class="dim2"> · ${esc(s.horizon||'')}</span></span></div>
        <div class="note" style="margin:0 0 5px">${esc(s.evidence||'')}</div>`).join('')
      :'<div class="note">No setup category matched — the evidence for every pattern was absent.</div>'}
    <div class="sec">Sector context</div>
    <div class="note">${lvS.sector?esc(lvS.sector):'sector unknown'}${lvS.sector_rank?` — ranked #${lvS.sector_rank}`:' — no rank available, so it scores no credit'}
      ${(lvS.context&&lvS.context.note)?'<br>'+esc(lvS.context.note):''}</div>
    <div class="sec">Invalidation logic</div>
    <div class="note">${d.invalidation&&d.invalidation.note?esc(d.invalidation.note):'no objective invalidation level'}${
      lv.invalidation_basis?` — placed at the <b>${esc(lv.invalidation_basis)}</b>, so the stop is a level the chart defines rather than a round number.`:''}</div>
    <div class="sec">Target rationale</div>
    ${lv.state==='ok'?`<div class="note">Target 1: ${esc(lv.target_1_basis||'—')}.<br>
      Target 2: ${esc(lv.target_2_basis||'—')}.<br>
      Targets are measured moves off the 20-day range, never multiples of the stop — so the ${num(lv.rr_target_1,2)}:1 varies with this chart instead of being a constant.
      ${lv.note?'<br><b>'+esc(lv.note)+'</b>':''}
      ${lv.do_not_chase_above!=null?'<br>Do not chase above '+num(lv.do_not_chase_above,2)+'.':''}</div>`
      :`<div class="note">${esc(lv.reason||'no levels')}</div>`}
    ${d.candidate_origin==='on_demand'&&(d.funnel&&(d.funnel.failed_gates||[]).length)?
      `<div class="sec">Scan gates this name fails</div>
       <ul class="rl">${d.funnel.failed_gates.map(g=>`<li class="neg">${esc(g.replace(/_/g,' '))}</li>`).join('')}</ul>
       <div class="note">${esc(d.funnel.note||'')}</div>`:''}
    <div class="note" style="margin-top:8px">${esc(d.context_cannot_override||'')}</div>`;
}

/* ── HISTORY: the full record, no dropdown ── */

  const h=((Snap.sec('history')||{}).data)||{};

  const cls=h.classification;
  const c=/STRONG/.test(cls)?'b-bull':/WEAK/.test(cls)?'b-bear':/INSUFFICIENT|NO HISTORY/.test(cls)?'b-neut':'b-stale';
  if(/INSUFFICIENT|NO HISTORY/.test(cls))
    return `<div class="flexrow"><span class="badge ${c}">${esc(cls)}</span>
        <span class="dim2" style="font-size:10px">${h.sample_size||0} comparable setup(s)</span></div>
      <div class="note" style="margin-top:5px">${esc(h.classification_reason||'')}</div>

      <div class="note" style="margin-top:5px;color:var(--amber)">${esc(h.news_note||'')}</div>`;
  const row=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const r10=s.ret_10d||{}, r5=s.ret_5d||{}, r20=s.ret_20d||{};
  return `<div class="flexrow" style="margin-bottom:6px">
      <span class="badge ${c}">${esc(cls)}</span>

      <span class="dim2" style="font-size:10px">${h.sample_size} of ${h.total_instances} instances</span>
    </div>
    <div class="note" style="margin-bottom:6px">Strategy <b>${esc(String(h.strategy||'—').replace(/_/g,' '))}</b> ·
      ${esc(w.first||'?')} → ${esc(w.last||'?')} · ${h.horizon_days}-day horizon ·
      above the ${Math.round((h.similarity_floor||0)*100)}% similarity floor</div>
    <div class="g2" style="font-size:11px">
      ${row('T1 hit rate','<span class="green">'+num(s.t1_hit_rate,0)+'%</span>')}
      ${row('T2 hit rate','<span class="green">'+num(s.t2_hit_rate,0)+'%</span>')}
      ${row('Stop rate','<span class="red">'+num(s.stop_hit_rate,0)+'%</span>')}
      ${row('Win rate',num(s.win_rate,0)+'%')}
      ${row('Profit factor',s.profit_factor==null?'—':num(s.profit_factor,2))}
      ${row('Expectancy','<span class="'+cls2(s.expectancy_pct)+'">'+num(s.expectancy_pct,2)+'%</span>')}
      ${row('Expectancy (R)',num(s.expectancy_r,2))}
      ${row('Avg holding time',num(s.avg_hold_days,1)+'d')}
      ${row('Avg MFE','<span class="green">+'+num(s.avg_mfe_pct,1)+'%</span>')}
      ${row('Avg MAE','<span class="red">'+num(s.avg_mae_pct,1)+'%</span>')}
      ${row('Max loss','<span class="red">'+num(s.max_loss_pct,1)+'%</span>')}
      ${row('Max losing streak',s.max_losing_streak??'—')}
    </div>
    <div class="sec">Median forward return</div>
    <table><thead><tr><th class="nosort">Horizon</th><th class="nosort">Median</th><th class="nosort">Avg</th><th class="nosort">Positive</th></tr></thead><tbody>
      ${[['5d',r5],['10d',r10],['20d',r20]].map(([k,r])=>
        `<tr><td>${k}</td><td class="${cls2(r.median)}">${num(r.median,2)}%</td>
         <td class="${cls2(r.avg)}">${num(r.avg,2)}%</td><td>${num(r.positive_pct,0)}%</td></tr>`).join('')}
    </tbody></table>
    ${s.exit_mix?`<div class="note" style="margin-top:5px">Exits — target 1: ${s.exit_mix.target_1||0} · target 2: ${s.exit_mix.target_2||0} · stop: ${s.exit_mix.stop||0} · horizon: ${s.exit_mix.horizon||0}</div>`:''}
    <div class="sec">Closest matches</div>
    <table><thead><tr><th class="nosort">Date</th><th class="nosort">Sim</th><th class="nosort">Regime</th><th class="nosort">Ret</th><th class="nosort">Exit</th><th class="nosort">Held</th></tr></thead><tbody>
      ${(h.examples||[]).slice(0,8).map(e=>`<tr><td>${esc(e.date)}</td><td>${e.similarity!=null?Math.round(e.similarity*100)+'%':'—'}</td>
        <td style="text-align:left;font-size:10px">${esc((e.regime||{}).trend||'?')}</td>
        <td class="${cls2(e.return_pct)}">${num(e.return_pct,1)}%</td>
        <td style="text-align:left;font-size:10px">${esc(e.exit)}</td><td>${e.held_days}d</td></tr>`).join('')||'<tr><td colspan="6" class="dim">none</td></tr>'}

    <div class="sec">Limits</div>
    <div class="flexrow"><span class="badge b-stale">HISTORICAL OPTION EXECUTION · NOT VALIDATED</span></div>
    <div class="note" style="margin-top:5px">${esc(h.options_note||'')}</div>
    <div class="note" style="margin-top:5px">${esc(h.news_note||'')}</div>
    <div class="note" style="margin-top:5px">${esc(h.methodology||'')}</div>`;
}

/* ── RISK: the instrument-aware model, and the long rejection reason ── */
function decRisk(d){
  const rsec=((Snap.sec('risk')||{}).data)||{};
  const dd=d||((Snap.sec('decision')||{}).data)||{};
  const sz=dd.sizing||{};
  const sh=(sz.shares||{}).risk||{}, op=(sz.option||{}).risk||{};
  const ps=dd.portfolio_suitability||{};
  const elig=ps.eligibility||{};
  const pa=rsec.paper||{};
  const profile=ps.policy_profile||(sz.option||{}).policy_profile;
  const row=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  return `${profile?`<div class="flexrow" style="margin-bottom:6px"><span class="badge b-info">RISK PROFILE · ${esc(String(profile).toUpperCase())}</span>
      <span class="badge b-info">READ ONLY</span></div>`:''}
    <div class="sec">Shares</div>
    <div class="g2" style="font-size:11px">

/* ── OPTION: the contract, and the three distinct verdicts ── */
function decOption(d){
  const o=((Snap.sec('options')||{}).data)||{};
  const dd=d||((Snap.sec('decision')||{}).data)||{};
  const best=o.best_contract;
  const q=dd.contract_quality||{}, ps=dd.portfolio_suitability||{};
  const elig=ps.eligibility||{};
  const row=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  return `${best?`<div class="flexrow" style="margin-bottom:6px">
      <b class="mono" style="font-size:13px">${esc(best.expiry||'')} $${num(best.strike,2)} ${esc((best.side||'call').toUpperCase())}</b>
      <span class="badge ${best.tradeable?'b-bull':'b-bear'}">${best.tradeable?'PASSES GATES':'REJECTED'}</span></div>
    <div class="g2" style="font-size:11px">
      ${row('Bid / Ask',num(best.bid,2)+' / '+num(best.ask,2))}
      ${row('Spread',num(best.spread_pct,1)+'%')}
      ${row('Delta',num(best.delta,3))}
      ${row('Theta',num(best.theta,3))}
      ${row('IV',best.implied_volatility!=null?(best.implied_volatility*100).toFixed(0)+'%':'—')}
      ${row('DTE',best.dte??'—')}
      ${row('Open interest',kmb(best.open_interest))}
      ${row('Volume',kmb(best.volume))}
      ${row('Break-even',num(best.break_even,2))}
      ${row('Move to break-even',num(best.pct_move_to_break_even,1)+'%')}
      ${row('Probability',best.chance_of_profit_long!=null?(best.chance_of_profit_long*100).toFixed(0)+'%':'—')}
      ${row('Premium',money((best.limit_price||0)*100))}
    </div>
    ${best.greeks_provenance==='model'?`<div class="note" style="margin-top:4px">Greeks are modelled (Black-Scholes), not provider-supplied.</div>`:''}`

    <div class="kv"><span class="k">Option quality <span class="dim2">— best in its chain?</span></span>

    <div class="kv"><span class="k">Portfolio suitability <span class="dim2">— should THIS account?</span></span>
      <span class="v"><span class="badge ${ps.pass?'b-bull':'b-bear'}">${ps.pass?'PASS':'FAIL'}</span></span></div>
    <div class="kv"><span class="k">Final instrument</span>
      <span class="v"><span class="badge b-info">${esc(dd.instrument||'—')}</span></span></div>
    ${!ps.pass?`<div class="sec">Binding constraint</div>
      <div class="note">${elig.binding_constraint?`The option fails on <b>${esc(elig.binding_constraint)}</b>`:'The option does not fit the active risk policy'}${
        (elig.checks||[]).filter(c=>!c.pass).length?` — ${(elig.checks||[]).filter(c=>!c.pass).length} of ${(elig.checks||[]).length} policy checks fail. Full table in the Risk tab.`:'.'}</div>
      ${(elig.checks||[]).filter(c=>!c.pass).slice(0,3).map(c=>
        `<div class="note" style="margin-top:3px">• ${esc(c.check)}: ${esc(c.detail||'')}</div>`).join('')}`:''}
    ${(dd.reasons_for_option||[]).length?`<div class="sec">For the option</div>

function contractDetail(c){
  const skip=new Set(['symbol','side']);
  return `<div class="g2">`+Object.entries(c).filter(([k,v])=>!skip.has(k)&&v!=null&&typeof v!=='object')

}

/* ═══════════════ SEARCH ═══════════════ */
let searchTimer,searchSel=-1,searchItems=[];
$('#search').addEventListener('input',e=>{
  clearTimeout(searchTimer); const q=e.target.value.trim();
  if(!q){showRecent();return}
  searchTimer=setTimeout(async()=>{
    const d=await DL.get('/api/search?q='+encodeURIComponent(q)+'&limit=10');
    searchItems=(d&&d.results)||[]; searchSel=searchItems.length?0:-1; paintSearch('Results');
  },110);
});
$('#search').addEventListener('focus',()=>{if(!$('#search').value.trim())showRecent()});
$('#search').addEventListener('keydown',e=>{
  const box=$('#searchResults');
  if(e.key==='Escape'){box.style.display='none';$('#search').blur();return}
  if(!searchItems.length)return;
  if(e.key==='ArrowDown'){searchSel=(searchSel+1)%searchItems.length;paintSearch();e.preventDefault()}
  else if(e.key==='ArrowUp'){searchSel=(searchSel-1+searchItems.length)%searchItems.length;paintSearch();e.preventDefault()}
  else if(e.key==='Enter'){const it=searchItems[searchSel]||searchItems[0];if(it)pick(it.symbol);e.preventDefault()}
});
document.addEventListener('click',e=>{if(!e.target.closest('#searchWrap'))$('#searchResults').style.display='none'});
async function showRecent(){
  const r=(state.recent||[]).map(s=>({symbol:s,name:''}));
  if(r.length){searchItems=r;searchSel=0;paintSearch('Recent');return}
  const d=await DL.get('/api/search/popular');
  searchItems=(d&&d.results)||[]; searchSel=0; paintSearch('Popular');
}
function paintSearch(heading){
  const box=$('#searchResults');
  if(!searchItems.length){box.style.display='none';return}
  box.innerHTML=(heading?`<div class="rhead">${esc(heading)}</div>`:'')+searchItems.map((it,i)=>
    `<div class="r ${i===searchSel?'sel':''}" data-sym="${esc(it.symbol)}" data-i="${i}">
      <span class="rl"><b class="mono">${esc(it.symbol)}</b> <span class="dim">${esc(it.name||'')}</span></span>
      <span class="dim2" style="font-size:9px">${esc(it.exchange||'')} ${it.type?`<span class="tt">${esc(String(it.type).slice(0,4).toUpperCase())}</span>`:''}</span>
    </div>`).join('');
  box.style.display='block';
  box.querySelectorAll('.r').forEach(r=>r.onclick=()=>pick(r.dataset.sym));
}
function pick(sym){$('#search').value='';$('#searchResults').style.display='none';$('#search').blur();setSymbol(sym)}

/* ═══════════════ ROUTER (3 utility areas, ONE workspace) ═══════════════ */
function go(view){
  state.view=view; save();
  $$('#rail button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  $('#view-terminal').classList.toggle('hidden',view!=='terminal');
  $('#view-portfolio').classList.toggle('hidden',view!=='portfolio');
  $('#view-settings').classList.toggle('hidden',view!=='settings');
  if(view==='terminal'){Grid.layout();renderAll()}
  if(view==='portfolio')renderPortfolio();
  if(view==='settings')renderSettings();
}
$$('#rail button').forEach(b=>b.onclick=()=>go(b.dataset.view));

        <td class="red">${num(p.stop,2)}</td><td class="green">${num(p.target,2)}</td>

      :`<div class="note">No open positions.</div>`}
    <div class="sec">Closed</div>
    ${(a.closed||[]).length?`<table><thead><tr><th class="nosort">Sym</th><th class="nosort">Qty</th><th class="nosort">Entry</th><th class="nosort">Exit</th><th class="nosort">P&L</th><th class="nosort">Reason</th></tr></thead><tbody>`+
      a.closed.slice(-40).reverse().map(p=>`<tr class="click" data-sym="${esc(p.symbol)}"><td>${esc(p.symbol)}</td><td>${num(p.quantity,4)}</td>
        <td>${num(p.avg_entry,2)}</td><td>${num(p.avg_exit,2)}</td><td class="${cls(p.realized_pnl)}">${money(p.realized_pnl)}</td>
        <td style="text-align:left;font-size:10px">${esc(p.exit_reason||'')}</td></tr>`).join('')+`</tbody></table>`
      :`<div class="note">No closed trades yet.</div>`}
    <div class="note" style="margin-top:10px">Ledger <b>${esc(a.ledger||'')}</b> · simulated, not real money. ${esc((a.config&&a.config.note)||'')}</div>`;
  el.querySelectorAll('tr[data-sym]').forEach(t=>t.onclick=()=>{setSymbol(t.dataset.sym);go('terminal')});

    <div>
      <div class="sec">Workspace</div>
      <div class="note">Layout, selected symbol, scanner filters, chosen expiry and account mode persist in this browser.</div>

/* ═══════════════ DRAWERS ═══════════════ */

function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('on')}
function closeHealth(){$('#healthDrawer').classList.remove('open');$('#scrim').classList.remove('on')}
$('#scrim').onclick=()=>{closeDrawer();closeHealth()};
$('#healthBtn').onclick=async()=>{
  $('#healthDrawer').classList.add('open');$('#scrim').classList.add('on');
  const body=$('#healthBody'); body.innerHTML=skel(6);
  const [h,st]=await Promise.all([DL.get('/api/health'),DL.get('/api/terminal/status')]);
  const prov=(h.providers&&h.providers.providers)||h.providers||{};
  body.innerHTML=`<div class="sec">Market</div>${mktBadge((st||{}).market)}
    <div class="sec">Datasets</div>
    ${((st||{}).datasets||[]).map(d=>`<div class="kv"><span class="k">${esc(d.label||d.id)} <span class="dim2">${esc(d.scope||'')}</span></span>
      <span class="v"><span class="badge ${PRES_CLS[d.presentation]||'b-neut'}">${esc(d.presentation||'?')}</span> ${d.age_seconds!=null?ago(d.age_seconds):''}</span></div>`).join('')}
    <div class="sec">Jobs</div>
    ${((st||{}).jobs||[]).map(j=>`<div class="kv"><span class="k">${esc(j.label)}</span>
      <span class="v">${j.running?'<span class="badge b-load">running</span>':j.stalled?'<span class="badge b-stale">stalled</span>':j.idle?'<span class="badge b-neut">idle</span>':'<span class="badge b-fresh">ok</span>'} ${j.age_seconds!=null?ago(j.age_seconds):''}</span></div>
      ${j.note?`<div class="note" style="margin:-2px 0 5px">${esc(j.note)}</div>`:''}`).join('')}

    ${Object.entries(prov).map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v" style="font-size:10px">${esc(typeof v==='object'?(v.state||JSON.stringify(v).slice(0,40)):v)}</span></div>`).join('')||'<div class="note">—</div>'}
    <div class="sec">Sections · this symbol</div>
    ${Object.entries(Snap.sections()).map(([n,s])=>`<div class="kv"><span class="k">${esc(n)}</span><span class="v">${freshChip(s)} <span class="dim2" style="font-size:9px">${esc(s.cache_state||'')}</span></span></div>`).join('')}

$('#wsBtn').onclick=()=>openDrawer('▦ Workspace',`
  <div class="note">Drag a widget by its header. Resize from the bottom-right corner. Collapse with –, close with ✕; closed widgets reappear in the tray under the grid.</div>
  <div class="sec">Widgets</div>
  ${Grid.items.map(i=>`<div class="kv"><span class="k">${esc(WIDGETS[i.id].title)}</span>
    <span class="v"><button class="pill-btn" data-tog="${i.id}">${i.closed?'restore':'close'}</button></span></div>`).join('')}

$('#drawerBody').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tog]'); if(!b)return;

  if(!it.closed){it.collapsed=false;Grid.resolve(it)}
  Grid.save();Grid.render();Grid.compact();Grid.layout();if(!it.closed)renderWidget(it.id);

});

/* ═══════════════ ACCOUNT SWITCH ═══════════════ */
$$('#acctSeg button').forEach(b=>b.onclick=()=>{

$$('#acctSeg button').forEach(x=>x.classList.toggle('on',x.dataset.a===state.account));
$('#symRefresh').onclick=()=>Snap.refresh();

/* ═══════════════ KEYBOARD ═══════════════ */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='/'){e.preventDefault();$('#search').focus();$('#search').select()}
  else if(e.key==='r'){Snap.refresh()}
  else if(e.key==='h'){$('#healthBtn').click()}
  else if(e.key==='t'){go('terminal')}
});

/* ═══════════════ BOOT ═══════════════ */
Grid.init();
go(state.view||'terminal');
paintSymbolChip();
renderAll();
Snap.load(state.symbol).then(()=>Live.schedule());
loadStatus().then(()=>Live.schedule());
loadScan(false);
setInterval(()=>{if(!document.hidden)loadStatus()},30000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){Live.stop();return}
  Snap.load(state.symbol); loadStatus(); Live.schedule();
});
