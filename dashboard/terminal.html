<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal · $500</title>
<style>
:root{
  --bg:#080b11; --panel:#0f151e; --panel2:#0b1017; --raise:#141c28;
  --border:#1d2836; --border2:#293646; --text:#d9e1ec; --dim:#7d8ba0; --dim2:#54606f;
  --accent:#4c8dff; --accent-dim:#1c3253; --green:#2bd07c; --red:#fb4d5f; --amber:#f0b429;
  --cash:#f0b429; --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  --gap:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:12px;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:40px 30px 1fr;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .accent{color:var(--accent)}
.hidden{display:none!important}
.spacer{flex:1}
button{font-family:inherit;cursor:pointer}

/* ══ COMMAND BAR ══ */
#cmdbar{display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(180deg,#0f151e,#0b1017);border-bottom:1px solid var(--border);z-index:60}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.5px;font-size:12px;white-space:nowrap}
.brand .diamond{color:var(--accent)}
#searchWrap{position:relative;flex:0 1 260px;min-width:130px}
#search{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--text);
  padding:5px 8px 5px 26px;font-family:var(--mono);font-size:11px;outline:none}
#search:focus{border-color:var(--accent)}
#searchWrap .mag{position:absolute;left:8px;top:5px;color:var(--dim);font-size:12px}
#searchWrap .kbd{position:absolute;right:6px;top:4px;font-size:9px;color:var(--dim2);border:1px solid var(--border2);border-radius:3px;padding:1px 4px}
#searchResults{position:absolute;top:32px;left:0;right:0;background:var(--raise);border:1px solid var(--border2);border-radius:7px;overflow:hidden;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5);max-height:320px;overflow-y:auto;z-index:80}
#searchResults .r{padding:6px 10px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;border-bottom:1px solid var(--border);align-items:center}
#searchResults .r:hover,#searchResults .r.sel{background:var(--accent-dim)}
#searchResults .r .rl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#searchResults .rhead{padding:4px 10px;font-size:9px;letter-spacing:.09em;color:var(--dim2);text-transform:uppercase;background:var(--panel2);border-bottom:1px solid var(--border)}
.tt{display:inline-block;font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;border:1px solid var(--border2);color:var(--dim)}

/* selected-symbol chip — the one global */
#symChip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:6px;padding:3px 10px;white-space:nowrap}
#symChip .s{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.5px}
#symChip .p{font-family:var(--mono);font-size:13px}
#symChip .c{font-family:var(--mono);font-size:11px}
.acct-seg{display:flex;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.acct-seg button{background:transparent;border:0;color:var(--dim);padding:5px 9px;font-size:10px;font-weight:600}
.acct-seg button.on[data-a=paper]{background:var(--accent);color:#04101f}
.acct-seg button.on[data-a=cash],.acct-seg button.on[data-a=robinhood]{background:var(--cash);color:#1a1400}
.tb-btn{background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--dim);padding:5px 8px;font-size:11px}
.tb-btn:hover{color:var(--text);border-color:var(--accent)}
.tb-btn.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.tb-item{display:flex;flex-direction:column;line-height:1.2;padding:0 3px}
.tb-item .lab{font-size:8px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2)}
.tb-item .val{font-family:var(--mono);font-size:11px}

/* ══ CONTEXT STRIP: per-dataset freshness, never one global age ══ */
#ctxbar{display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel2);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;z-index:50}
#ctxbar::-webkit-scrollbar{height:0}
.ctx{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border)}
.ctx b{color:var(--text);font-weight:600}
.ctx .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2)}

/* ══ SHELL ══ */
#shell{display:grid;grid-template-columns:46px 1fr;min-height:0}
#rail{background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:3px}
#rail button{width:38px;height:38px;border-radius:8px;background:transparent;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:7.5px;letter-spacing:.3px}
#rail button .ic{font-size:14px}
#rail button:hover{background:var(--raise);color:var(--text)}
#rail button.on{background:var(--accent-dim);color:var(--accent)}
#rail .grow{flex:1}
#stage{overflow:auto;min-width:0;min-height:0;position:relative;padding:var(--gap)}
.pane{padding:4px}

/* ══ WIDGET GRID ══ */
#grid{position:relative;width:100%}
.w{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;
   transition:box-shadow .12s,border-color .12s}
.w.drag{z-index:40;box-shadow:0 16px 40px rgba(0,0,0,.6);border-color:var(--accent);opacity:.95;transition:none}
.w.sizing{z-index:40;border-color:var(--accent);transition:none}
.wh{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel2);border-bottom:1px solid var(--border);cursor:grab;user-select:none;flex-shrink:0;min-height:26px}
.wh:active{cursor:grabbing}
.wt{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:700;white-space:nowrap}
.wtools{display:flex;gap:2px;opacity:.35;transition:opacity .12s}
.w:hover .wtools{opacity:1}
.wtools button{background:transparent;border:0;color:var(--dim);font-size:11px;line-height:1;padding:2px 4px;border-radius:4px}
.wtools button:hover{background:var(--raise);color:var(--text)}
.wb{flex:1;overflow:auto;padding:8px 10px;min-height:0}
.wb.pad0{padding:0}
.w.collapsed{height:auto!important}
.w.collapsed .wb,.w.collapsed .rh{display:none}
/* Eight resize handles, not one. The old build had a single bottom-right grip, so the
   top and left boundaries were structurally immovable — a widget could only ever grow
   down and right. Edges are 6px strips, corners 12px squares sitting above them. */
.rh{position:absolute;z-index:6;touch-action:none}
.rh-n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rh-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}
.rh-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rh-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}
.rh-nw{top:-3px;left:-3px;width:12px;height:12px;cursor:nwse-resize}
.rh-ne{top:-3px;right:-3px;width:12px;height:12px;cursor:nesw-resize}
.rh-sw{bottom:-3px;left:-3px;width:12px;height:12px;cursor:nesw-resize}
.rh-se{bottom:-3px;right:-3px;width:12px;height:12px;cursor:nwse-resize}
.rh-se::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;
  border-right:2px solid var(--border2);border-bottom:2px solid var(--border2);border-radius:0 0 2px 0}
.w:hover .rh-se::after{border-color:var(--accent)}
.w:hover .rh{background:transparent}
.w.sizing .rh{pointer-events:none}
.w.maxed{z-index:30;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#ghost{position:absolute;background:var(--accent-dim);border:1px dashed var(--accent);border-radius:8px;pointer-events:none;display:none;z-index:1}
#closedTray{display:flex;gap:6px;flex-wrap:wrap;padding:6px 2px 0}
#closedTray button{background:var(--panel2);border:1px dashed var(--border2);color:var(--dim);border-radius:6px;padding:4px 9px;font-size:10px}
#closedTray button:hover{border-color:var(--accent);color:var(--text)}

/* ══ PRIMITIVES ══ */
.badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;letter-spacing:.3px;border:1px solid transparent;white-space:nowrap}
.b-bull{background:rgba(43,208,124,.14);color:var(--green);border-color:rgba(43,208,124,.3)}
.b-bear{background:rgba(251,77,95,.14);color:var(--red);border-color:rgba(251,77,95,.3)}
.b-neut{background:rgba(125,139,160,.14);color:var(--dim);border-color:rgba(125,139,160,.28)}
.b-fresh{background:rgba(43,208,124,.14);color:var(--green);border-color:rgba(43,208,124,.28)}
.b-ageing,.b-stale{background:rgba(240,180,41,.12);color:var(--amber);border-color:rgba(240,180,41,.3)}
.b-critical,.b-fail{background:rgba(251,77,95,.14);color:var(--red);border-color:rgba(251,77,95,.3)}
.b-info{background:var(--accent-dim);color:var(--accent);border-color:rgba(76,141,255,.3)}
.b-load{background:rgba(125,139,160,.10);color:var(--dim2);border-color:var(--border)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.a{background:var(--amber)}.dot.d{background:var(--dim2)}

table{width:100%;border-collapse:collapse;font-size:11px}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:right;padding:4px 6px;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;cursor:pointer}
thead th:first-child,tbody td:first-child{text-align:left}
thead th.nosort{cursor:default}
tbody td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--border);font-family:var(--mono);white-space:nowrap}
tbody tr:hover{background:var(--raise)}
tbody tr.click{cursor:pointer}
tbody tr.sel{background:var(--accent-dim)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}

.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--border);font-size:11px}
.kv:last-child{border:0}
.kv .k{color:var(--dim)} .kv .v{font-family:var(--mono);text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 7px;min-width:0}
.stat .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--mono);font-size:14px;margin-top:1px}
.stat .s{font-size:9px;color:var(--dim2);margin-top:1px}
.hr{height:1px;background:var(--border);margin:7px -10px}
.sec{font-size:8.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim2);font-weight:700;margin:8px 0 4px}
.sec:first-child{margin-top:0}
.pill-btn{background:var(--panel2);border:1px solid var(--border2);color:var(--dim);border-radius:5px;padding:3px 7px;font-size:10px}
.pill-btn:hover{color:var(--text);border-color:var(--accent)}
.pill-btn.on{background:var(--accent);color:#04101f;border-color:var(--accent)}
select.mini,input.mini{background:var(--panel2);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:3px 6px;font-family:var(--mono);font-size:10px;outline:none}
select.mini:focus,input.mini:focus{border-color:var(--accent)}
.flexrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--raise) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:4px;height:10px;margin:6px 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.state{padding:16px 10px;text-align:center;color:var(--dim)}
.state .ico{font-size:18px;margin-bottom:4px}
.state .msg{font-size:11px;margin-bottom:3px;color:var(--text)}
.state .sub{font-size:10px;color:var(--dim2);line-height:1.5}
.state button{margin-top:8px}
.note{font-size:10px;color:var(--dim2);line-height:1.5}
ul.rl{margin:3px 0 0;padding-left:15px;font-size:10.5px;line-height:1.55;color:var(--dim)}
ul.rl li{margin-bottom:2px}
ul.rl li.pos{color:var(--green)} ul.rl li.neg{color:var(--amber)} ul.rl li.blk{color:var(--red)}
details.more{margin-top:6px}
details.more>summary{cursor:pointer;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);list-style:none;padding:3px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";color:var(--accent)}
details.more[open]>summary::before{content:"▾ "}
details.more>summary:hover{color:var(--text)}

/* verdict block */
.verdict{border-radius:7px;padding:8px 10px;border:1px solid;margin-bottom:8px}
.v-go{background:rgba(43,208,124,.08);border-color:rgba(43,208,124,.35)}
.v-watch{background:rgba(240,180,41,.07);border-color:rgba(240,180,41,.35)}
.v-no{background:rgba(125,139,160,.07);border-color:var(--border2)}
.v-stale{background:rgba(251,77,95,.10);border-color:rgba(251,77,95,.5)}
.verdict .vl{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.verdict .vi{font-size:11px;font-weight:700;letter-spacing:.7px;margin-top:3px}
.verdict .vr{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.riskgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.riskgrid .rc{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:4px 6px}
.riskgrid .rc .l{font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2)}
.riskgrid .rc .v{font-family:var(--mono);font-size:12.5px;margin-top:1px}
.hbar{height:4px;border-radius:3px;background:var(--panel2);overflow:hidden;display:flex;margin-top:3px}
.hbar i{display:block;height:100%}
/* ── Decision widget: sticky header + horizontal evidence tabs ──
   The header must survive every tab switch AND stay put while a tab scrolls, so it
   is sticky inside the widget body. Tabs scroll sideways when the widget is narrow —
   never collapse into a dropdown, which would re-hide the evidence tabs exist to
   expose. */
.dtop{position:sticky;top:0;z-index:4;background:var(--panel);box-shadow:0 4px 8px -6px rgba(0,0,0,.8)}
.dhead{padding:8px 10px 0}
.dpane{padding:8px 10px 10px}
.dtabs{display:flex;gap:1px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  padding:5px 10px 0;border-bottom:1px solid var(--border)}
.dtabs::-webkit-scrollbar{height:0}
.dtabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:4px 8px 5px;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  white-space:nowrap;flex:0 0 auto}
.dtabs button:hover{color:var(--text)}
.dtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.dtabs button .st{font-size:7px;vertical-align:super;margin-left:2px}
/* thesis grid — the six-to-nine line answer to "what supports this and what doesn't" */
.thesis{display:grid;grid-template-columns:1fr auto;gap:0 10px}
.thesis .trow{display:contents}
.thesis .trow .k{font-size:10.5px;color:var(--dim);padding:2px 0;border-bottom:1px solid var(--border)}
.thesis .trow .v{font-family:var(--mono);font-size:10.5px;font-weight:600;text-align:right;padding:2px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.nrow{padding:5px 0;border-bottom:1px solid var(--border)}
.nrow .nt{font-size:11px;line-height:1.42}
.nrow .nt a{color:var(--text);text-decoration:none}
.nrow .nt a:hover{color:var(--accent)}
.tierchip{font-size:8px;font-weight:700;letter-spacing:.3px;padding:0 4px;border-radius:3px;border:1px solid transparent}
.t-DIRECT{background:rgba(76,141,255,.16);color:var(--accent);border-color:rgba(76,141,255,.35)}
.t-INDIRECT_SECTOR{background:rgba(240,180,41,.12);color:var(--amber)}
.t-MARKET_WIDE,.t-LOW{background:rgba(125,139,160,.12);color:var(--dim2)}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,94vw);background:var(--panel);border-left:1px solid var(--border2);transform:translateX(100%);transition:transform .18s ease;z-index:90;display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
.drawer.open{transform:translateX(0)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px}
.drawer .db{overflow-y:auto;padding:12px}
.drawer .x{background:transparent;border:0;color:var(--dim);font-size:16px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;display:none}
#scrim.on{display:block}
svg text{font-family:var(--mono)}
</style>
</head>
<body>

<div id="cmdbar">
  <div class="brand"><span class="diamond">◆</span>TERMINAL</div>
  <div id="searchWrap">
    <span class="mag">⌕</span>
    <input id="search" placeholder="Symbol…  PLTR, AAPL, BRK.B" autocomplete="off" spellcheck="false">
    <span class="kbd">/</span>
    <div id="searchResults"></div>
  </div>
  <div id="symChip">
    <span class="s" id="symTicker">—</span>
    <span class="p" id="symPrice">—</span>
    <span class="c" id="symChg">—</span>
    <span id="symFresh"></span>
  </div>
  <button class="tb-btn" id="symRefresh" title="Refresh this symbol only (does NOT rescan the universe)">⟳ Symbol</button>
  <div class="spacer"></div>
  <div class="acct-seg" id="acctSeg">
    <button data-a="paper" class="on">Paper</button>
    <button data-a="cash">Cash</button>
    <button data-a="robinhood">RH</button>
  </div>
  <div class="tb-item"><span class="lab">Market</span><span class="val" id="mktStatus">—</span></div>
  <button class="tb-btn" id="wsBtn" title="Workspace">▦ Layout</button>
  <button class="tb-btn" id="healthBtn" title="System health (h)">◉ Health</button>
</div>

<div id="ctxbar"><span class="ctx"><span class="k">loading</span></span></div>

<div id="shell">
  <nav id="rail">
    <button data-view="terminal" class="on"><span class="ic">▦</span>Term</button>
    <button data-view="portfolio"><span class="ic">▤</span>Port</button>
    <span class="grow"></span>
    <button data-view="settings"><span class="ic">⚙</span>Set</button>
  </nav>
  <main id="stage">
    <div id="view-terminal">
      <div id="grid"><div id="ghost"></div></div>
      <div id="closedTray"></div>
    </div>
    <div id="view-portfolio" class="pane hidden"></div>
    <div id="view-settings" class="pane hidden"></div>
  </main>
</div>

<div id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><b id="drawerTitle">—</b><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="db" id="drawerBody"></div>
</div>
<div class="drawer" id="healthDrawer">
  <div class="dh"><b>◉ System Health</b><button class="x" onclick="closeHealth()">✕</button></div>
  <div class="db" id="healthBody"></div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   ONE workspace, ONE selected symbol. Every widget is a view of the same
   snapshot, so nothing on this screen can disagree with anything else on it.
   ═══════════════════════════════════════════════════════════════════════════ */

const LS_STATE='term_v2_state', LS_LAYOUT='term_v2_layout';
const state=Object.assign({
  symbol:'PLTR', account:'paper', view:'terminal', tf:'3M',
  optExp:null, optSide:'call', watchSrc:'scan', scanPreset:'liquid', minScore:0, trackedView:'today',
  // Selected evidence tab in the Trade Decision widget. Persisted with the rest of
  // the workspace and deliberately NOT reset by setSymbol — switching ticker while
  // reading HISTORY should leave you reading HISTORY.
  decTab:'overview',
  chartMA:{20:true,50:true,200:false}, ovLevels:true,
  recent:[]
}, JSON.parse(localStorage.getItem(LS_STATE)||'{}'));
function save(){try{localStorage.setItem(LS_STATE,JSON.stringify(state))}catch(e){}}

/* ── helpers ── */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n==null||n!==n?'–':(n<0?'-$':'$')+Math.abs(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>n==null?'–':'$'+(+n).toLocaleString(undefined,{maximumFractionDigits:0});
const pct=n=>n==null?'–':(n>=0?'+':'')+(+n).toFixed(2)+'%';
const num=(n,d=2)=>n==null||n!==n?'–':(+n).toFixed(d);
const cls=n=>n==null?'dim':(n>0?'green':n<0?'red':'dim');
// Counts keep their precision until they are genuinely large: rounding 1,549 open
// interest to "2K" overstates the depth of a contract by 30% in the one place a
// reader is judging whether it can be got out of.
const kmb=n=>n==null?'–':Math.abs(n)>=1e9?(n/1e9).toFixed(1)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':
  Math.abs(n)>=1e4?(n/1e3).toFixed(0)+'K':Math.round(n).toLocaleString();
const dollarsC=n=>n==null?'–':Math.abs(n)>=1e9?'$'+(n/1e9).toFixed(1)+'B':Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(0)+'M':money0(n);
const ago=s=>s==null?'—':s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+'m':s<86400?Math.round(s/3600)+'h':Math.round(s/86400)+'d';
const yn=b=>b==null?'<span class="dim2">?</span>':b?'<span class="green">✓</span>':'<span class="red">✕</span>';

/* ── data layer: cache + in-flight dedup + SWR (no duplicate concurrent GETs) ── */
const DL={
  cache:new Map(), inflight:new Map(), stats:{req:0,hit:0,dedup:0,miss:0,err:0},
  ttl(u){
    if(u.startsWith('/api/terminal/status'))return 8000;
    if(u.startsWith('/api/terminal/symbol'))return 4000;
    if(u.startsWith('/api/scan'))return 60000;
    if(u.startsWith('/api/options/watchlists'))return 300000;
    if(u.startsWith('/api/paper/account'))return 5000;
    if(u.startsWith('/api/health'))return 20000;
    if(u.startsWith('/api/search'))return 60000;
    return 15000;
  },
  _fetch(url){
    const ctl=new AbortController();
    const p=fetch(url,{signal:ctl.signal}).then(async r=>{
      const t=await r.text();
      if(!r.ok&&!t)throw new Error('HTTP '+r.status);
      const d=JSON.parse(t);
      this.cache.set(url,{ts:Date.now(),data:d}); this.inflight.delete(url); return d;
    }).catch(e=>{
      this.inflight.delete(url);
      const c=this.cache.get(url);
      if(c&&e.name!=='AbortError')return c.data;
      this.stats.err++; return {__err:String(e.message||e)};
    });
    this.inflight.set(url,{promise:p,ctl}); return p;
  },
  async get(url,{force=false}={}){
    this.stats.req++;
    const c=this.cache.get(url), age=c?Date.now()-c.ts:Infinity;
    if(c&&age<this.ttl(url)&&!force){this.stats.hit++;return c.data;}
    // one in-flight request per URL — a widget storm collapses to a single GET
    if(this.inflight.has(url)){this.stats.dedup++;return this.inflight.get(url).promise;}
    this.stats.miss++; return this._fetch(url);
  },
  async post(url,body){
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
      return await r.json();
    }catch(e){return {__err:String(e.message||e)}}
  },
  drop(frag){for(const k of [...this.cache.keys()])if(k.includes(frag))this.cache.delete(k);}
};

/* ── freshness: the shared classifier's vocabulary, rendered ONE way ──
   LIVE / DELAYED / MARKET CLOSED · LAST CLOSE / STALE · REFRESH FAILED / UNKNOWN.
   A widget that is still loading says LOADING — never a freshness state it hasn't
   earned, and never an old badge left looking current.                        */
const PRES_CLS={'LIVE':'b-fresh','DELAYED':'b-stale','MARKET CLOSED · LAST CLOSE':'b-info',
                'STALE · REFRESH FAILED':'b-critical','UNKNOWN':'b-neut'};
function freshChip(sec){
  if(!sec)return '';
  if(sec.state==='loading')return '<span class="badge b-load" title="fetching in the background">LOADING</span>';
  if(sec.state==='error')return `<span class="badge b-critical" title="${esc(sec.reason||'')}">FAILED</span>`;
  if(sec.state==='unavailable'||sec.state==='insufficient_history')
    return `<span class="badge b-neut" title="${esc(sec.reason||'')}">N/A</span>`;
  const f=sec.freshness||{};
  const p=f.presentation||'UNKNOWN';
  const short={'MARKET CLOSED · LAST CLOSE':'CLOSED · LAST','STALE · REFRESH FAILED':'STALE'}[p]||p;
  const tip=`${p}${f.age_seconds!=null?' · '+ago(f.age_seconds)+' old':''}`
          +`${f.kind?'\nwindow: '+f.kind:''}${f.label?'\n'+f.label:''}`
          +(f.critical?'\nCRITICAL input for a live decision':'');
  return `<span class="badge ${PRES_CLS[p]||'b-neut'}" title="${esc(tip)}">${esc(short)}</span>`;
}
function mktBadge(m){
  if(!m||!m.state)return '<span class="dim">○ —</span>';
  const d=s=>{const h=Math.floor(s/3600),mm=Math.floor(s%3600/60);return `${h}h ${String(mm).padStart(2,'0')}m`};
  const t=m.seconds_until_close, o=m.seconds_to_open;
  switch(m.state){
    case 'open':      return `<span class="green">● OPEN</span>`+(t!=null?` <span class="dim2">closes ${d(t)}</span>`:'');
    case 'premarket': return `<span class="green">◐ PRE</span>`+(o!=null?` <span class="dim2">opens ${d(o)}</span>`:'');
    case 'afterhours':return `<span class="green">◑ AFTER</span>`+(o!=null?` <span class="dim2">opens ${d(o)}</span>`:'');
    case 'holiday':   return `<span class="dim">○ HOLIDAY</span> <span class="dim2">${esc(m.holiday||'')}</span>`;
    default:          return `<span class="dim">○ CLOSED</span>`+(o!=null?` <span class="dim2">opens ${d(o)}</span>`:'');
  }
}
function skel(n=4){let h='';for(let i=0;i<n;i++)h+=`<div class="sk" style="width:${55+Math.random()*40}%"></div>`;return h}
function emptyBox(ico,msg,sub,btn){return `<div class="state"><div class="ico">${ico}</div><div class="msg">${esc(msg)}</div><div class="sub">${esc(sub||'')}</div>${btn||''}</div>`}
function sectionBox(sec,label){
  if(!sec)return emptyBox('○','No data','');
  if(sec.state==='loading')return `<div class="state"><div class="ico">◌</div><div class="msg">Loading ${esc(label)}…</div><div class="sub">Computing in the background — the rest of the terminal is unaffected.</div></div>`;
  if(sec.state==='error')return emptyBox('⚠',label+' unavailable',sec.reason||'The provider returned an error. Other widgets are unaffected.');
  if(sec.state==='unavailable'||sec.state==='insufficient_history')return emptyBox('○',label+' not available',sec.reason||'');
  return null;
}

/* ═══════════════ WIDGET GRID: drag · resize · collapse · close · persist ═════
   12 columns; row height is fixed so a saved layout restores identically. The
   smallest implementation that is actually reliable: pointer events, an explicit
   collision pass, upward compaction. No framework, no CDN.                   */
const COLS=12, ROW=22, GAP=8;
const DEFAULT_LAYOUT=[
  {id:'watchlist', x:0, y:0,  w:3, h:18},
  {id:'chart',     x:3, y:0,  w:6, h:11},
  // The decision widget is taller than the others by default: verdict + levels +
  // position + thesis + why/watch + historical fit is a lot of answer, and the
  // historical block landing just below the fold made the terminal look like it had
  // been left out. Saved layouts win over this, so it only affects a fresh workspace.
  {id:'decision',  x:9, y:0,  w:3, h:23},
  {id:'options',   x:3, y:11, w:6, h:13},
  {id:'risk',      x:0, y:18, w:3, h:12},
  {id:'news',      x:9, y:23, w:3, h:14},
  {id:'technicals',x:3, y:24, w:6, h:6},
];
// Per-widget floors, in grid units. A widget that can be squashed to 2x3 is not
// resizable, it is destructible — the chart needs room for candles AND a volume pane,
// the option chain needs columns, the scanner can live narrow.
const MIN_SIZE={
  watchlist:{w:2,h:6}, chart:{w:4,h:9}, decision:{w:3,h:10},
  options:{w:5,h:8},   risk:{w:3,h:7},  news:{w:3,h:7}, technicals:{w:4,h:5},
};
const minOf=id=>MIN_SIZE[id]||{w:2,h:4};
const Grid={
  items:[], el:null, ghost:null, drag:null,
  load(){
    let saved=null;
    try{saved=JSON.parse(localStorage.getItem(LS_LAYOUT)||'null')}catch(e){}
    const def=()=>DEFAULT_LAYOUT.map(d=>({...d,collapsed:false,closed:false}));
    if(!saved||!Array.isArray(saved.items)){this.items=def();return}
    // Merge: a widget added in a later build appears at its default slot rather
    // than silently vanishing from a layout saved before it existed.
    const byId=new Map(saved.items.map(i=>[i.id,i]));
    this.items=DEFAULT_LAYOUT.map(d=>{
      const s=byId.get(d.id);
      const m=MIN_SIZE[d.id]||{w:2,h:4};
      return s?{id:d.id,x:Math.max(0,+s.x||0),y:Math.max(0,+s.y||0),
                w:Math.min(COLS,Math.max(m.w,+s.w||d.w)),h:Math.max(m.h,+s.h||d.h),
                collapsed:!!s.collapsed,closed:!!s.closed,
                restore:s.restore||null,maxed:!!s.maxed}
              :{...d,collapsed:false,closed:false,restore:null,maxed:false};
    });
  },
  save(){try{localStorage.setItem(LS_LAYOUT,JSON.stringify({v:2,items:this.items}))}catch(e){}},
  reset(){localStorage.removeItem(LS_LAYOUT);this.load();this.render();this.layout();renderAll();},
  get(id){return this.items.find(i=>i.id===id)},
  open(){return this.items.filter(i=>!i.closed)},
  colW(){return (this.el.clientWidth-(COLS-1)*GAP)/COLS},
  px(it){const cw=this.colW();return{
    left:Math.round(it.x*(cw+GAP)), top:Math.round(it.y*(ROW+GAP)),
    width:Math.round(it.w*cw+(it.w-1)*GAP), height:Math.round(it.h*ROW+(it.h-1)*GAP)};},
  render(){
    const g=this.el;
    [...g.querySelectorAll('.w')].forEach(n=>{if(!this.get(n.dataset.id)||this.get(n.dataset.id).closed)n.remove()});
    for(const it of this.open()){
      let n=g.querySelector(`.w[data-id="${it.id}"]`);
      if(!n){
        n=document.createElement('section');
        n.className='w'; n.dataset.id=it.id;
        n.innerHTML=`<header class="wh"><span class="wt">${esc(WIDGETS[it.id].title)}</span>
            <span class="wfresh"></span><span class="whx"></span><span class="spacer"></span>
            <span class="wtools">
              <button data-act="max" title="Maximise / restore">⤢</button>
              <button data-act="collapse" title="Collapse / expand">–</button>
              <button data-act="close" title="Close widget">✕</button>
            </span></header>
          <div class="wb"></div>
          ${['n','s','w','e','nw','ne','sw','se'].map(d=>`<div class="rh rh-${d}" data-rh="${d}"></div>`).join('')}`;
        g.appendChild(n);
      }
      n.classList.toggle('collapsed',!!it.collapsed);
      n.classList.toggle('maxed',!!it.maxed);
    }
    this.renderTray();
  },
  renderTray(){
    const closed=this.items.filter(i=>i.closed);
    $('#closedTray').innerHTML = closed.length
      ? `<span class="dim2" style="font-size:10px;align-self:center">Closed:</span>`+
        closed.map(i=>`<button data-restore="${i.id}">+ ${esc(WIDGETS[i.id].title)}</button>`).join('')
      : '';
  },
  layout(){
    const g=this.el; let maxY=0;
    for(const it of this.open()){
      const n=g.querySelector(`.w[data-id="${it.id}"]`); if(!n)continue;
      const p=this.px(it);
      n.style.left=p.left+'px'; n.style.top=p.top+'px'; n.style.width=p.width+'px';
      if(it.collapsed){n.style.height='auto';maxY=Math.max(maxY,it.y+2);}
      else{n.style.height=p.height+'px';maxY=Math.max(maxY,it.y+it.h);}
    }
    g.style.height=(maxY*(ROW+GAP))+'px';
  },
  /* collision: push overlapped widgets down, then pull everything up */
  resolve(moved){
    const others=this.open().filter(i=>i!==moved);
    const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
    let guard=0;
    let queue=[moved];
    while(queue.length&&guard++<200){
      const cur=queue.shift();
      for(const o of others){
        if(o!==cur&&hit(cur,o)){o.y=cur.y+cur.h;queue.push(o);}
      }
    }
    this.compact();
  },
  compact(){
    const sorted=this.open().slice().sort((a,b)=>a.y-b.y||a.x-b.x);
    const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
    for(const it of sorted){
      while(it.y>0){
        const test={...it,y:it.y-1};
        if(sorted.some(o=>o!==it&&hit(test,o)))break;
        it.y--;
      }
    }
  },
  cellFromPx(px,py){
    const cw=this.colW();
    return {x:Math.max(0,Math.min(COLS-1,Math.round(px/(cw+GAP)))),
            y:Math.max(0,Math.round(py/(ROW+GAP)))};
  },
  init(){
    this.el=$('#grid'); this.ghost=$('#ghost');
    this.load(); this.render(); this.layout();
    addEventListener('resize',()=>this.layout());

    this.el.addEventListener('click',e=>{
      const b=e.target.closest('button[data-act]'); if(!b)return;
      const it=this.get(b.closest('.w').dataset.id); if(!it)return;
      if(b.dataset.act==='max'){return this.toggleMax(it.id);}
      if(b.dataset.act==='collapse'){it.collapsed=!it.collapsed;}
      else if(b.dataset.act==='close'){it.closed=true;}
      this.save(); this.render(); this.compact(); this.layout();
      if(!it.closed&&!it.collapsed)renderWidget(it.id);
    });
    $('#closedTray').addEventListener('click',e=>{
      const b=e.target.closest('button[data-restore]'); if(!b)return;
      const it=this.get(b.dataset.restore); if(!it)return;
      it.closed=false; it.collapsed=false;
      this.resolve(it); this.save(); this.render(); this.layout(); renderWidget(it.id);
    });

    // `dir` is null for a move, else one of n/s/e/w/nw/ne/sw/se. A direction
    // containing 'w' or 'n' moves the widget's ORIGIN as well as its size — that is
    // the whole reason the old single-corner handle could not resize leftward.
    const start=(e,dir)=>{
      const node=e.target.closest('.w'); if(!node)return;
      const it=this.get(node.dataset.id); if(!it)return;
      if(it.collapsed&&dir)return;               // nothing to resize while collapsed
      e.preventDefault();
      const r=node.getBoundingClientRect(), gr=this.el.getBoundingClientRect();
      this.drag={it,node,dir,mode:dir?'size':'move',startX:e.clientX,startY:e.clientY,
                 ox:r.left-gr.left,oy:r.top-gr.top,
                 ow:it.w,oh:it.h,ax:it.x,ay:it.y};
      node.classList.add(dir?'sizing':'drag');
      try{node.setPointerCapture(e.pointerId)}catch(_){}
      const p=this.px(it);
      Object.assign(this.ghost.style,{display:'block',left:p.left+'px',top:p.top+'px',
        width:p.width+'px',height:p.height+'px'});
    };
    this.el.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      const h=e.target.closest('[data-rh]');
      if(h)return start(e,h.dataset.rh);         // edge or corner -> resize
      if(e.target.closest('.wh')&&!e.target.closest('button'))return start(e,null);  // header -> move
    });
    this.el.addEventListener('pointermove',e=>{
      const d=this.drag; if(!d)return;
      const dx=e.clientX-d.startX, dy=e.clientY-d.startY, cw=this.colW();
      if(d.mode==='move'){
        d.node.style.left=(d.ox+dx)+'px'; d.node.style.top=(d.oy+dy)+'px';
        const c=this.cellFromPx(d.ox+dx,d.oy+dy);
        d.it.x=Math.min(c.x,COLS-d.it.w); d.it.y=c.y;
      }else{
        // Convert the pixel delta to whole grid cells, then apply it to the edge(s)
        // the pointer grabbed. Right/bottom change size; left/top change size AND
        // origin, with the opposite edge pinned.
        const m=minOf(d.it.id);
        const dCols=Math.round(dx/(cw+GAP)), dRows=Math.round(dy/(ROW+GAP));
        let {x,y,w,h}=({x:d.ax,y:d.ay,w:d.ow,h:d.oh});
        if(d.dir.includes('e')) w=d.ow+dCols;
        if(d.dir.includes('s')) h=d.oh+dRows;
        if(d.dir.includes('w')){                 // pin the RIGHT edge
          const right=d.ax+d.ow;
          x=Math.min(right-m.w,Math.max(0,d.ax+dCols));
          w=right-x;
        }
        if(d.dir.includes('n')){                 // pin the BOTTOM edge
          const bottom=d.ay+d.oh;
          y=Math.min(bottom-m.h,Math.max(0,d.ay+dRows));
          h=bottom-y;
        }
        w=Math.max(m.w,Math.min(COLS-x,w));
        h=Math.max(m.h,h);
        Object.assign(d.it,{x,y,w,h});
        const p=this.px(d.it);
        d.node.style.left=p.left+'px'; d.node.style.top=p.top+'px';
        d.node.style.width=p.width+'px'; d.node.style.height=p.height+'px';
      }
      const p=this.px(d.it);
      Object.assign(this.ghost.style,{left:p.left+'px',top:p.top+'px',width:p.width+'px',height:p.height+'px'});
    });
    const end=e=>{
      const d=this.drag; if(!d)return;
      this.drag=null;
      d.node.classList.remove('drag','sizing');
      this.ghost.style.display='none';
      this.resolve(d.it); this.save(); this.layout();
      // Re-render from the CACHED snapshot only. Geometry is a frontend concern: a
      // resize must never refetch a quote, rerun the scanner, reload history or
      // recompute risk. `renderWidget` reads Snap.data and issues no request.
      if(d.mode==='size')renderWidget(d.it.id);
    };
    this.el.addEventListener('pointerup',end);
    this.el.addEventListener('pointercancel',end);
    addEventListener('pointerup',end);            // release outside the grid still ends it
  },
  /* Maximise / restore. The previous geometry is stored ON the item so a reload
     while maximised can still put the widget back where it was. */
  toggleMax(id){
    const it=this.get(id); if(!it)return;
    if(it.maxed&&it.restore){
      Object.assign(it,{...it.restore,maxed:false,restore:null});
    }else{
      it.restore={x:it.x,y:it.y,w:it.w,h:it.h};
      Object.assign(it,{x:0,y:0,w:COLS,h:Math.max(it.h,26),maxed:true,collapsed:false});
    }
    this.resolve(it); this.save(); this.render(); this.layout(); renderWidget(id);
  }
};

/* ═══════════════ THE SNAPSHOT: one fetch, every widget ═══════════════
   The coordinator owns refresh. Widgets never fetch the symbol themselves, so
   seven widgets cost one request and can never show seven different vintages. */
const Snap={
  data:null, symbol:null, timer:null, polling:false,
  sections(){return (this.data&&this.data.sections)||{}},
  sec(n){return this.sections()[n]},
  async load(sym,{force=false}={}){
    sym=(sym||state.symbol||'').toUpperCase();
    const url=`/api/terminal/symbol?symbol=${encodeURIComponent(sym)}&range=${encodeURIComponent(state.tf)}`;
    const d=await DL.get(url,{force});
    if((state.symbol||'').toUpperCase()!==sym)return;   // user moved on; drop this
    if(d&&!d.__err){this.data=d;this.symbol=sym;}
    else this.data={state:'error',reason:(d||{}).__err,sections:{}};
    renderAll(); paintSymbolChip(); paintCtx();
    this.schedule();
  },
  // Poll only while something is still computing; then fall back to a slow tick.
  // A poll must bypass the client TTL cache — otherwise it re-reads the same
  // "loading" payload it is polling to replace, and convergence stalls at the TTL.
  //
  // BUG (found 2026-08-10): the hidden-tab check used to live INSIDE the fired
  // callback with no re-arm on the skip branch — `if(!document.hidden) load()`
  // and nothing else. A tab backgrounded while sections were still pending (the
  // common case: open the terminal, tab away while chart/news/decision compute)
  // dropped that one fire silently and never scheduled another; only a manual
  // reload or the visibilitychange listener could unstick it, so news/chart
  // widgets could sit on stale/loading data indefinitely. Fixed to mirror
  // Live.tick()'s pattern: re-arm itself even while hidden, so the very next
  // natural tick after the tab regains focus does real work (on top of the
  // immediate visibilitychange kick below).
  schedule(){
    clearTimeout(this.timer);
    const pending=(this.data&&this.data.pending)||[];
    const wait=pending.length?1500:20000;
    this.timer=setTimeout(()=>{
      if(document.hidden){this.schedule();return}
      this.load(state.symbol,{force:pending.length>0});
    },wait);
  },
  async refresh(){
    const sym=state.symbol;
    const btn=$('#symRefresh'); btn.disabled=true; btn.textContent='⟳ …';
    DL.drop('/api/terminal/symbol');
    const d=await DL.post('/api/terminal/refresh',{symbol:sym});
    if(d&&!d.__err&&d.sections){this.data=d;this.symbol=sym;renderAll();paintSymbolChip();}
    btn.disabled=false; btn.textContent='⟳ Symbol';
    this.schedule(); loadStatus();
  }
};

/* ═══════════════ LIVE QUOTE ═══════════════
   A separate, deliberately tiny loop: it asks for the `quote` section ONLY. History,
   the option chain, news, risk and the scanner are untouched by it, so the chart's
   current candle keeps moving even while the ~18s Robinhood account path is in
   flight. Off entirely when the exchange is shut — polling a closed market would be
   burning quota to redraw the same number.                                        */
const Live={
  timer:null, inflight:false, lastMs:0,
  intervalMs(){
    const m=((Snap.data||{}).market||{}).state||((Status||{}).market||{}).state;
    if(m==='open')return 4000;
    if(m==='premarket'||m==='afterhours')return 12000;
    return 0;                                   // closed / holiday -> no polling
  },
  stop(){clearTimeout(this.timer);this.timer=null},
  schedule(){
    this.stop();
    const ms=this.intervalMs();
    if(!ms)return;
    this.timer=setTimeout(()=>this.tick(),ms);
  },
  async tick(){
    if(document.hidden||this.inflight){this.schedule();return}
    const sym=state.symbol;
    this.inflight=true;
    const t0=performance.now();
    const d=await DL.get(`/api/terminal/symbol?symbol=${encodeURIComponent(sym)}&sections=quote`,{force:true});
    this.inflight=false;
    this.lastMs=Math.round(performance.now()-t0);
    if(state.symbol!==sym){this.schedule();return}   // user moved on mid-flight
    const q=d&&d.sections&&d.sections.quote;
    if(q&&q.state==='ok'&&Snap.data&&Snap.data.sections){
      Snap.data.sections.quote=q;                    // one section, in place
      ChartView.setLive(q.data);                     // update the CURRENT candle only
      paintSymbolChip();
      renderWidget('chart');                         // reuses the canvas, no refetch
    }
    this.schedule();
  }
};

/* ═══════════════ GLOBAL SYMBOL ═══════════════ */
function setSymbol(sym,opts){
  sym=(sym||'').toUpperCase().trim(); if(!sym||sym===state.symbol)return;
  state.symbol=sym;
  state.optExp=null;                       // expiry belongs to the previous symbol
  state.recent=[sym,...(state.recent||[]).filter(s=>s!==sym)].slice(0,10);
  save();
  Snap.data=null; Snap.symbol=sym;
  ChartView.key=''; ChartView.liveBar=null; ChartView.live=null;  // new symbol = new history
  paintSymbolChip(); renderAll();          // every widget switches together
  Snap.load(sym,opts);
  Live.schedule();
}
function paintSymbolChip(){
  $('#symTicker').textContent=state.symbol||'—';
  const q=(Snap.sec('quote')||{});
  const d=q.data||{};
  $('#symPrice').textContent=d.price!=null?('$'+num(d.price,2)):'—';
  const c=$('#symChg');
  c.textContent=d.change_pct!=null?pct(d.change_pct):'—';
  c.className='c '+cls(d.change_pct);
  $('#symFresh').innerHTML=freshChip(q);
}

/* ═══════════════ CONTEXT STRIP + STATUS ═══════════════
   Three facts that used to contradict each other, now named and scoped:
   the exchange session, per-dataset freshness, and whether a JOB is running.  */
let Status=null;
async function loadStatus(){
  const d=await DL.get('/api/terminal/status');
  if(d&&!d.__err)Status=d;
  $('#mktStatus').innerHTML=mktBadge((Status||{}).market);
  paintCtx();
}
function paintCtx(){
  const bits=[];
  const secs=Snap.sections();
  const order=['quote','options','news','levels','risk'];
  const label={quote:'Quote',options:'Chain',news:'News',levels:'Levels',risk:'Account'};
  for(const k of order){
    const s=secs[k]; if(!s)continue;
    bits.push(`<span class="ctx"><span class="k">${label[k]}</span>${freshChip(s)}</span>`);
  }
  for(const ds of ((Status||{}).datasets||[])){
    const p=ds.presentation||'UNKNOWN';
    const short={'MARKET CLOSED · LAST CLOSE':'CLOSED · LAST','STALE · REFRESH FAILED':'STALE'}[p]||p;
    const run=ds.running?' <span class="badge b-load">refreshing</span>':'';
    bits.push(`<span class="ctx"><span class="k">${esc(ds.label||ds.id)}</span>`+
      `<span class="badge ${PRES_CLS[p]||'b-neut'}" title="${esc(p+(ds.age_seconds!=null?' · '+ago(ds.age_seconds):''))}">${esc(short)}</span>${run}</span>`);
  }
  // A job being idle is a JOB fact, not a data fact — labelled as such so it can
  // never be read as "the market data is stale". Running / stalled / idle are three
  // different statements and get three different badges.
  for(const j of ((Status||{}).jobs||[])){
    let badge='';
    if(j.running)badge='<span class="badge b-load">running</span>';
    else if(j.stalled)badge=`<span class="badge b-stale">stalled ${ago(j.age_seconds)}</span>`;
    else if(j.idle)badge=`<span class="badge b-neut">idle ${ago(j.age_seconds)}</span>`;
    if(badge)bits.push(`<span class="ctx" title="${esc(j.note||'')}"><span class="k">${esc(j.label)}</span>${badge}</span>`);
  }
  const cs=(Snap.data&&Snap.data.critical_stale)||[];
  if(cs.length)bits.unshift(`<span class="ctx" style="border-color:var(--red)"><span class="k">Decision</span><span class="badge b-critical">STALE — REFRESH REQUIRED</span></span>`);
  $('#ctxbar').innerHTML=bits.join('')||'<span class="ctx"><span class="k">—</span></span>';
}

/* ── 1. WATCHLIST / SCANNER ─────────────────────────────────────────────── */
// The 'tracked' tab is itself split into four sub-views, backed by the scan_cohort
// MEMORY layer (dashboard/scan_cohort.py) — a fresh Top-5 identity per real scan,
// tracked forward regardless of whether its entry ever triggers — plus the older
// entry-trigger alert tracker (tracker.py) kept as its own 'Alerts' sub-view rather
// than the thing that decides what stays visible (see scan_cohort.py's module
// docstring for why those two are deliberately separate systems).
let scanData=null, wlData=null, trackedData=null, trackedBusy=false, scanSort={k:'score',dir:-1};
let cohortToday=null, cohortHistory=null, cohortIntel=null, cohortSelectedScanId=null, cohortBusy=false;
async function loadScan(force){
  // PEEK by default: the funnel is an 800-name universe operation and must never
  // start just because a widget appeared. `force` is the explicit user action.
  const url=force?`/api/scan?preset=${state.scanPreset}`:`/api/scan?preset=${state.scanPreset}&peek=1`;
  scanData=await DL.get(url,{force:!!force});
  renderWidget('watchlist');
  if(force&&scanData&&scanData.state==='loading')setTimeout(()=>loadScan(false),4000);
}
async function loadWatchlists(){ wlData=await DL.get('/api/options/watchlists'); renderWidget('watchlist'); }
async function loadTracked(force){ trackedData=await DL.get('/api/tracker?include_closed=1',{force:!!force}); renderWidget('watchlist'); }
async function refreshTracked(){
  trackedBusy=true; renderWidget('watchlist');
  await DL.post('/api/tracker/update',{});
  DL.drop('/api/tracker'); trackedBusy=false; await loadTracked(true);
}
const TRACK_STATUS_CLS={watch:'b-neut',approaching_entry:'b-info',entry_triggered:'b-info',
  target_1_reached:'b-bull',target_2_reached:'b-bull',invalidated:'b-critical',
  expired:'b-neut',data_unavailable:'b-stale',manually_closed:'b-neut'};
const COHORT_STATUS_CLS={selected:'b-neut',watching:'b-neut',approaching_entry:'b-info',
  entry_triggered:'b-info',target_1_hit:'b-bull',target_2_hit:'b-bull',invalidated:'b-critical',
  thesis_broken:'b-critical',expired:'b-stale',horizon_complete:'b-stale',manually_closed:'b-neut'};
async function loadCohortToday(force){ cohortToday=await DL.get(`/api/cohort/today${cohortSelectedScanId?'?scan_id='+cohortSelectedScanId:''}`,{force:!!force}); renderWidget('watchlist'); }
async function loadCohortHistory(force){ cohortHistory=await DL.get('/api/cohort/history?limit=30',{force:!!force}); renderWidget('watchlist'); }
async function loadCohortIntel(force){ cohortIntel=await DL.get('/api/cohort/intelligence?horizon=d5',{force:!!force}); renderWidget('watchlist'); }
async function refreshCohort(){
  cohortBusy=true; renderWidget('watchlist');
  await DL.post('/api/cohort/update',{});
  DL.drop('/api/cohort'); cohortBusy=false; await loadCohortToday(true);
}
function pickCohortScan(scanId){ cohortSelectedScanId=scanId; DL.drop('/api/cohort/today'); cohortToday=null; state.trackedView='today'; save(); renderWidget('watchlist'); loadCohortToday(true); }
function renderWatchlist(b){
  const src=state.watchSrc;
  const tabs=[['scan','Scan'],['watch','Robinhood'],['tracked','Tracked'],['recent','Recent']]
    .map(([k,l])=>`<button class="pill-btn ${src===k?'on':''}" data-wsrc="${k}">${l}</button>`).join('');
  const running=scanData&&(scanData.state==='loading'||scanData.cache_state==='refreshing');
  const tView=state.trackedView||'today';
  const subtabs=src==='tracked'?[['today',"Today's Scan"],['alerts','Alerts'],['history','History'],['intel','Intel']]
    .map(([k,l])=>`<button class="pill-btn ${tView===k?'on':''}" data-tview="${k}" style="font-size:9.5px">${l}</button>`).join(''):'';
  const head=`<div class="flexrow" style="margin-bottom:6px">${tabs}<span class="spacer"></span>
      ${src==='scan'?`<span class="dim2" style="font-size:9px">min</span>
      <input class="mini" id="minScore" type="number" min="0" max="100" step="5" style="width:46px" value="${state.minScore}">
      <button class="pill-btn" id="runScan" ${running?'disabled':''} title="Universe operation: ~800 names, 45-76s. Not triggered by selecting a symbol.">${running?'scanning…':'Run scan'}</button>`:''}
      ${src==='watch'?`<button class="pill-btn" id="reloadWl">⟳</button>`:''}
      ${src==='tracked'&&(tView==='today'||tView==='alerts')?`<button class="pill-btn" id="refreshTracked" ${(tView==='today'?cohortBusy:trackedBusy)?'disabled':''} title="Re-check tracked candidates against a fresh quote.">${(tView==='today'?cohortBusy:trackedBusy)?'checking…':'⟳ update'}</button>`:''}</div>
      ${src==='tracked'?`<div class="flexrow" style="margin-bottom:6px">${subtabs}</div>`:''}`;
  let body='';
  if(src==='scan'){
    if(!scanData){body=skel(6);}
    else if(scanData.state==='never_run'){
      body=emptyBox('⊞','No scan in cache',
        'The scan is a universe operation (~800 names, 45-76s). It is never started automatically — press Run scan.');
    }
    else if(scanData.state==='loading'){body=`<div class="note" style="margin-bottom:6px">Scanning the universe…</div>`+skel(6);}
    else{
      const cands=(scanData.candidates||[]).filter(c=>((c.score||{}).total||0)>=(state.minScore||0));
      const fin=new Set((scanData.finalists||[]).map(c=>c.symbol));
      cands.sort((a,b2)=>{
        const g=o=>scanSort.k==='score'?((o.score||{}).total||0):scanSort.k==='price'?((o.indicators||{}).price||0):
                 scanSort.k==='chg'?((o.indicators||{}).change_pct||0):(o.symbol||'');
        const x=g(a),y=g(b2);
        return (typeof x==='string'?x.localeCompare(y):x-y)*scanSort.dir;
      });
      body=cands.length?`<table><thead><tr>
          <th data-ss="symbol">Sym</th><th data-ss="price">Px</th><th data-ss="chg">Chg</th>
          <th data-ss="score">Score</th><th class="nosort">Setup</th></tr></thead><tbody>`+
        cands.slice(0,120).map(c=>{
          const i=c.indicators||{}, s=c.score||{};
          return `<tr class="click ${c.symbol===state.symbol?'sel':''}" data-sym="${esc(c.symbol)}">
            <td>${esc(c.symbol)} ${fin.has(c.symbol)?'<span class="badge b-bull" style="padding:0 3px">F</span>':''}</td>
            <td>${num(i.price,2)}</td><td class="${cls(i.change_pct)}">${pct(i.change_pct)}</td>
            <td>${num(s.total,1)}</td>
            <td style="text-align:left;font-size:9.5px;color:var(--dim)">${esc((c.primary_setup||'').replace(/_/g,' '))}</td></tr>`;
        }).join('')+`</tbody></table>
        <div class="note" style="margin-top:6px">${cands.length} candidates · ${(scanData.finalists||[]).length} finalists · scan ${ago(scanData.cache_age_s)} old</div>`
        : emptyBox('○','No candidates above the score filter','Lower the minimum or run a fresh scan.');
    }
  } else if(src==='watch'){
    if(!wlData){body=skel(5); loadWatchlists();}
    else if(wlData.__err||wlData.state==='unavailable'){body=emptyBox('⚠','Watchlists unavailable',wlData.reason||wlData.__err||'');}
    else{
      const lists=wlData.watchlists||[];
      body=lists.map(l=>{
        const items=(l.items||[]).filter(i=>i.object_type!=='currency_pair');
        const crypto=(l.items||[]).length-items.length;
        return `<div class="sec">${esc(l.name||'list')} <span class="dim2">${items.length}</span></div>`+
          (items.length?`<div class="flexrow">`+items.map(i=>
            `<button class="pill-btn ${i.symbol===state.symbol?'on':''}" data-sym="${esc(i.symbol)}">${esc(i.symbol)}</button>`).join('')+`</div>`
            :`<div class="note">empty</div>`)+
          (crypto?`<div class="note">${crypto} crypto pair(s) excluded — not equities</div>`:'');
      }).join('')||emptyBox('○','No watchlists','');
    }
  } else if(src==='tracked'){
    if(tView==='today') body=renderCohortToday();
    else if(tView==='alerts') body=renderTrackerAlerts();
    else if(tView==='history') body=renderCohortHistory();
    else body=renderCohortIntel();
  } else {
    const r=state.recent||[];
    body=r.length?`<div class="flexrow">`+r.map(s=>
      `<button class="pill-btn ${s===state.symbol?'on':''}" data-sym="${esc(s)}">${esc(s)}</button>`).join('')+`</div>`
      :emptyBox('○','Nothing yet','Symbols you select appear here.');
  }
  b.innerHTML=head+body;
  whead('watchlist',null, running?'<span class="badge b-load">scanning</span>':'');
  b.querySelectorAll('[data-wsrc]').forEach(x=>x.onclick=()=>{state.watchSrc=x.dataset.wsrc;save();renderWidget('watchlist');
    if(x.dataset.wsrc==='scan'&&!scanData)loadScan(false); if(x.dataset.wsrc==='watch'&&!wlData)loadWatchlists();
    if(x.dataset.wsrc==='tracked'){
      if(tView==='today'&&!cohortToday)loadCohortToday();
      if(tView==='alerts'&&!trackedData)loadTracked();
      if(tView==='history'&&!cohortHistory)loadCohortHistory();
      if(tView==='intel'&&!cohortIntel)loadCohortIntel();
    }});
  b.querySelectorAll('[data-tview]').forEach(x=>x.onclick=()=>{state.trackedView=x.dataset.tview;save();renderWidget('watchlist');
    if(x.dataset.tview==='today'&&!cohortToday)loadCohortToday();
    if(x.dataset.tview==='alerts'&&!trackedData)loadTracked();
    if(x.dataset.tview==='history'&&!cohortHistory)loadCohortHistory();
    if(x.dataset.tview==='intel'&&!cohortIntel)loadCohortIntel();});
  b.querySelectorAll('[data-sym]').forEach(x=>x.onclick=()=>setSymbol(x.dataset.sym));
  b.querySelectorAll('[data-scanid]').forEach(x=>x.onclick=(e)=>{e.preventDefault();pickCohortScan(x.dataset.scanid)});
  b.querySelectorAll('th[data-ss]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.ss; if(scanSort.k===k)scanSort.dir*=-1;else{scanSort.k=k;scanSort.dir=-1}renderWidget('watchlist');});
  const ms=b.querySelector('#minScore'); if(ms)ms.onchange=()=>{state.minScore=+ms.value||0;save();renderWidget('watchlist')};
  const rs=b.querySelector('#runScan'); if(rs)rs.onclick=()=>{rs.disabled=true;rs.textContent='scanning…';loadScan(true)};
  const rw=b.querySelector('#reloadWl'); if(rw)rw.onclick=()=>{DL.drop('/api/options/watchlists');wlData=null;loadWatchlists()};
  const rt=b.querySelector('#refreshTracked'); if(rt)rt.onclick=(tView==='today'?refreshCohort:refreshTracked);
}

/* ── Tracked / today's scan ──────────────────────────────────────────────── */
function renderCohortToday(){
  if(!cohortToday){loadCohortToday();return skel(5);}
  if(cohortToday.__err)return emptyBox('⚠','Cohort unavailable',cohortToday.__err);
  if(cohortToday.state==='empty')
    return emptyBox('⊞','No scan captured yet','Press Run scan (Scan tab) — its top 5 will appear here automatically.');
  const run=cohortToday.scan||{};
  const obs=cohortToday.observations||[];
  const hdr=`<div class="note" style="margin-bottom:6px">scan ${esc((run.scan_id||'').slice(0,8))} · `+
    `${run.created_at?ago((Date.now()-Date.parse(run.created_at))/1000):'–'} old · ${run.preset||''}`+
    (cohortSelectedScanId?` <a href="#" data-scanid="" style="color:var(--accent)">(back to latest)</a>`:'')+`</div>`;
  if(!obs.length)return hdr+emptyBox('○','Empty cohort','This scan produced no top-5 candidates.');
  const rows=obs.map(o=>{

      <td>${esc(o.symbol)}</td>
      <td>${num(o.score,1)}</td>

      <td>${num(o.scan_price,2)}</td>
      <td>${o.current_price!=null?num(o.current_price,2):'–'}</td>
      <td class="${cls(ret)}">${ret!=null?pct(ret):'–'}</td>
      <td><span class="badge ${COHORT_STATUS_CLS[o.status]||'b-neut'}" style="padding:0 3px">${esc((o.status||'').replace(/_/g,' '))}</span></td>
    </tr>`;
  }).join('');
  return hdr+`<table><thead><tr><th>#</th><th>Sym</th><th>Score</th><th class="nosort">Setup</th>
      <th>Scan Px</th><th>Now</th><th>Return</th><th class="nosort">Status</th></tr></thead>

function renderTrackerAlerts(){
  if(!trackedData){loadTracked();return skel(5);}
  if(trackedData.__err)return emptyBox('⚠','Tracker unavailable',trackedData.__err);
  const setups=(trackedData.setups||[]).slice().sort((a,c)=>(c.created_at||'').localeCompare(a.created_at||''));

    const chg=(s.last_price!=null&&s.original_price)?100*(s.last_price-s.original_price)/s.original_price:null;
    const added=s.created_at?s.created_at.slice(0,10):'–';
    return `<tr class="click ${s.symbol===state.symbol?'sel':''}" data-sym="${esc(s.symbol)}">
      <td>${esc(s.symbol)}</td>
